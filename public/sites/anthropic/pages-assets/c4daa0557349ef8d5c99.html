    <style>
/* race/murmuration-race.css */
/* Murmuration race.
   .mr is the full comparison. .mr-pane (one model's 16:9 pane), .mr-readout (its counters) and
   .mr-label-row can also be used on their own.
   Colour and font defaults. :where() keeps them easy to override: set the variables on .mr, or on
   the standalone element. Elements inside .mr take .mr's values. */
:where(.mr,
  .mr-pane:not(.mr .mr-pane),
  .mr-readout:not(.mr .mr-readout),
  .mr-label-row:not(.mr .mr-label-row)) {
  --mr-page: #FAF9F6;
  --mr-ink: #141413;
  --mr-ink-light: #F0EEE6;
  --mr-label: #87867F;
  --mr-markup: #B0AEA5;
  --mr-line-no: #5E5D59;
  --mr-sky: #F0EEE6;
  --mr-sans: 'Anthropic Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mr-mono: 'Anthropic Mono', 'JetBrains Mono', 'SF Mono', Monaco, 'Courier New', monospace;
}

/* ---------- full comparison ---------- */
.mr {
  --mr-gap: 40px;          /* between the two columns (or rows, when stacked) */
  --mr-label-gap: 16px;    /* between a label and its box */
  --mr-prompt-gap: 24px;   /* between the prompt line and the label rows */
  display: flex;
  flex-direction: column;
  gap: var(--mr-prompt-gap);
  background: var(--mr-page);
  color: var(--mr-ink);
  font-family: var(--mr-sans);
}

.mr-columns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--mr-gap);
}

/* "Prompt:" in the label colour, then the one-line summary. Always one line: the script shrinks it to fit on
   narrow screens (down to 12 px), and an ellipsis cuts anything longer. */
.mr-prompt {
  font-size: 16px;
  line-height: 24px;
  color: var(--mr-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mr-prompt-label {
  color: var(--mr-label);
  margin-right: 0.3em;
}

@media (max-width: 640px) {
  .mr {
    --mr-gap: 28px;
    --mr-prompt-gap: 20px;
  }
  .mr-columns {
    grid-template-columns: minmax(0, 1fr);
  }
}

.mr-column {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--mr-label-gap);
}

/* Name on the left, counters on the right. */
.mr-label-row {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

/* Previous model: muted, no dot. Latest model: ink, with a dot in its colour. */
.mr-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  line-height: 24px;
  color: var(--mr-label);
  white-space: nowrap;
}

.mr-label--latest {
  color: var(--mr-ink);
}

.mr-label-dot {
  width: 8px;
  height: 8px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--mr-model);
}

/* Counters: a muted word, then the value. Fixed-width number slots keep the words still. */
.mr-readout {
  margin-left: auto;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--mr-sans);
  font-size: 16px;
  line-height: 24px;
  font-variant-numeric: tabular-nums;
  white-space: pre;
}

.mr-readout-total {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-right: 10px;
}

.mr-readout-total[hidden] {
  display: none;
}

.mr-readout-word {
  color: var(--mr-label);
}

.mr-readout-value {
  color: var(--mr-ink);
}

/* Each character in its own fixed cell, filled from the right, so digits never shift. */
.mr-readout-num {
  display: inline-flex;
  justify-content: flex-end;
}

.mr-cell {
  display: inline-block;
  text-align: center;
}

.mr-cell[hidden] {
  display: none;
}

.mr-cell--digit {
  width: 0.64em;   /* Anthropic Sans tabular figure; change it if you change the font */
}

.mr-cell--sep {
  width: 0.236em;  /* comma or point */
}

/* Too narrow for both: keep the live counter, drop the total. */
@media (max-width: 480px) {
  .mr-readout-total {
    display: none;
  }
}

.mr-box {
  min-width: 0;
  border: 1px solid var(--mr-ink);
}

/* A per-model video in place of a live pane (same 16:9 shape). */
.mr-video {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: var(--mr-ink);
}

/* ---------- one pane ---------- */
/* Fills its box's width at 16:9. The stage is laid out at 640 x 360 and scaled by the script. */
.mr-pane {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: var(--mr-ink);
}

.mr-pane-stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 640px;
  height: 360px;
  transform-origin: 0 0;
}

.mr-code {
  position: absolute;
  inset: 0;
  overflow: hidden;
  font-family: var(--mr-mono);
  font-size: 14px;
  line-height: 21px;
}

/* Rows stack from the top; the script moves the column up smoothly as rows arrive. */
.mr-code-column {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 14px;
}

.mr-line {
  display: flex;
  gap: 12px;
  height: 21px;
  white-space: pre;
}

.mr-line[hidden] {
  display: none;
}

.mr-line-no {
  width: 26px;
  flex-shrink: 0;
  text-align: right;
  color: var(--mr-line-no);
  font-variant-numeric: tabular-nums;
}

.mr-line-text {
  min-width: 0;
  overflow: hidden;
  color: var(--mr-ink-light);
}

.mr-line-text[data-kind="comment"] {
  color: var(--mr-label);
}

.mr-line-text[data-kind="markup"] {
  color: var(--mr-markup);
}

/* Newest characters settle in: segment 0 is settled ink, 4 is the newest. */
.mr-seg-1 { opacity: 0.96; }
.mr-seg-2 { opacity: 0.9; }
.mr-seg-3 { opacity: 0.82; }
.mr-seg-4 { opacity: 0.72; }

/* Thinking headline, with a soft highlight sweeping across it. */
.mr-headline {
  --mr-shine-a: -48%;
  --mr-shine-b: -30%;
  --mr-shine-c: -12%;
  position: absolute;
  left: 16px;
  top: 16px;
  max-width: 400px;
  text-wrap: balance; /* no single word left alone on a line */
  font-family: var(--mr-sans);
  font-size: 16px;
  line-height: 24px;
  opacity: 0;
  background-image: linear-gradient(90deg, var(--mr-label) var(--mr-shine-a), var(--mr-ink-light) var(--mr-shine-b), var(--mr-label) var(--mr-shine-c));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.mr-caret {
  display: inline-block;
  width: 8.1667px;   /* one Anthropic Mono character at 14px */
  height: 16px;
  vertical-align: -4px;
  background: var(--mr-model);
}

.mr-sky {
  position: absolute;
  inset: 0;
  background: var(--mr-sky);
  clip-path: inset(0 0 100% 0);
}

.mr-sky-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 640px;
  height: 360px;
  display: block;
}

/* A reply that is a whole page runs in its own frame, in a bigger window shown smaller. */
.mr-sky-page {
  position: absolute;
  left: 0;
  top: 0;
  border: 0;
  background: var(--mr-sky);
  transform-origin: 0 0;
  pointer-events: none;
}

</style>

/* reference-listener.js */
/**
 * Hosted-artifact reference listener (protocol v1). Copy this file next to a
 * page that a Model Comparison side shows, load it as a classic script, and
 * draw from clock.time(). See docs/HOSTED-ARTIFACTS.md in the website repo.
 *
 *   var clock = createComparisonClock({
 *     duration: 57.2, // the page's loop length, in seconds
 *     onChange: function (playing) {}, // after every play or pause
 *   });
 *   // Draw the first frame synchronously (never inside requestAnimationFrame),
 *   // at clock.time(), then:
 *   clock.ready();
 *
 * Embedded by the block (its URL carries ?protocol=model-comparison), the page
 * starts paused and waits for the block's play message. Opened any other way,
 * it plays by itself, looping.
 */
(function () {
  var PROTOCOL = 'model-comparison';
  var VERSION = 1;

  function createComparisonClock(options) {
    var duration = options.duration;
    var onChange = options.onChange || function () {};
    var controlled = new URLSearchParams(location.search).get('protocol') === PROTOCOL;
    // Seconds played before the current run, and when the current run began
    // (performance.now(), in ms), or null while paused. Real time, never a sum
    // of frame lengths, so the page keeps time while it isn't drawing.
    var played = 0;
    var since = controlled ? null : performance.now();

    function time() {
      var elapsed = since === null ? 0 : (performance.now() - since) / 1000;
      return (played + elapsed) % duration;
    }

    if (controlled) {
      // Checked by sender, not origin: only the window that embeds the page may
      // drive it, whatever its origin (the site, a preview deploy, Storybook),
      // and a message can only play or pause the clock. An origin allowlist
      // would stop previews playing and protect nothing more.
      // nosemgrep: postmessage-missing-origin-check
      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) return;
        var data = event.data;
        if (!data || data.protocol !== PROTOCOL || data.version !== VERSION) return;
        if (data.type === 'play' && since === null) {
          since = performance.now();
          onChange(true);

  const on = (type, fn) => { (listeners[type] = listeners[type] || []).push(fn); };
  const doc = {
    body: element(), documentElement: element(), readyState: 'loading',
    getElementById: () => fakeCanvas,
    querySelector: (q) => (/canvas|#/.test(q) ? fakeCanvas : element()),
    querySelectorAll: () => [fakeCanvas],
    getElementsByTagName: (tag) => (/canvas/i.test(tag) ? [fakeCanvas] : [element()]),
    createElement: (tag) => (/canvas/i.test(tag) ? createCanvas() : element()),
    addEventListener: on, removeEventListener: noop
  };
  const raf = (fn) => { const id = nextId++; rafs.push({ id, fn }); return id; };
  const caf = (id) => { rafs = rafs.filter((r) => r.id !== id); };
  const perf = { now: () => now };
  const addTimer = (repeat) => (fn, ms, ...args) => {
    const id = nextId++;
    const wait = Math.max(0, +ms || 0);
    timers.push({ id, fn, args, at: now + wait, every: repeat ? Math.max(1, wait) : 0 });
    return id;
  };
  const clearTimer = (id) => { timers = timers.filter((t) => t.id !== id); };
  const loc = { href: 'about:blank', assign: noop, replace: noop, reload: noop, toString: () => 'about:blank' };
  const RealDate = Date;
  function FakeDate(...args) {
    if (!new.target) return new RealDate(epoch + now).toString();
    return args.length ? new RealDate(...args) : new RealDate(epoch + now);
  }
  FakeDate.now = () => epoch + now;
  FakeDate.parse = RealDate.parse;
  FakeDate.UTC = RealDate.UTC;
  FakeDate.prototype = RealDate.prototype;
  const win = {
    innerWidth: W, innerHeight: H, devicePixelRatio: 1,
    addEventListener: on, removeEventListener: noop,
    requestAnimationFrame: raf, cancelAnimationFrame: caf,
    setTimeout: addTimer(false), setInterval: addTimer(true), clearTimeout: clearTimer, clearInterval: clearTimer,
    performance: perf, document: doc, Math: M, Date: FakeDate, location: loc, open: () => null,
    matchMedia: () => ({ matches: false, addEventListener: noop, addListener: noop }),
    getComputedStyle: () => ({ getPropertyValue: () => '' }),
    console: { log: noop, warn: noop, error: noop, info: noop }
  };
  win.window = win; win.self = win; win.globalThis = win; win.top = win; win.parent = win;

  const fire = (type) => (listeners[type] || []).forEach((fn) => fn.call(win, { type }));
  try {
    program.run(win, doc, M, raf, caf, perf, W, H, 1, on, noop, win.setTimeout, clearTimer,
      win.setInterval, clearTimer, win.matchMedia, win.getComputedStyle, win.console, win, win, loc, win.open, FakeDate);
    doc.readyState = 'complete';
    fire('DOMContentLoaded');
    fire('load');
    if (typeof win.onload === 'function') win.onload({ type: 'load' });
  } catch (err) {
    failed = err;
    console.warn('Race: program failed to start', err);
    (window.__raceErrors = window.__raceErrors || []).push(String(err && err.stack || err));
  }

  return {
    get steps() { return steps; },
    step() {
      steps++;
      if (failed) return;
      now = steps * (1000 / STEPS_PER_SECOND);
      try {
        for (const t of timers.filter((x) => x.at <= now)) {
          if (t.every) t.at += t.every; else clearTimer(t.id);
          t.fn.apply(win, t.args);
        }
        const due = rafs;
        rafs = [];
        for (const r of due) r.fn(now);
      } catch (err) {
        failed = err;
        console.warn('Race: program stopped', err);
        (window.__raceErrors = window.__raceErrors || []).push(String(err && err.stack || err));
      }
    }
  };
}

// ---------- DOM ----------
function el(tag, className, parent) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (parent) parent.appendChild(node);
  return node;
}

// The inside of a pane: thinking headlines, the streaming code, then the program's window.
function buildPane(run, host) {
  const pane = el('div', 'mr-pane', host);
  pane.style.setProperty('--mr-model', run.color);
  const stage = el('div', 'mr-pane-stage', pane);
  const code = el('div', 'mr-code', stage);
  const column = el('div', 'mr-code-column', code);
  const lines = [];
  for (let i = 0; i < CODE_LAYOUT.rows + 2; i++) {
    const line = el('div', 'mr-line', column);
    const no = el('span', 'mr-line-no', line);
    const text = el('span', 'mr-line-text', line);
    const segs = [];
    for (let s = 0; s < 5; s++) segs.push(el('span', 'mr-seg mr-seg-' + s, text));
    line.hidden = true;
    lines.push({ line, no, text, segs, key: '' });
  }
  const caret = el('span', 'mr-caret');
  const headline = el('div', 'mr-headline', code);
  const sky = el('div', 'mr-sky', stage);
  const canvas = el('canvas', 'mr-sky-canvas', sky);
  canvas.setAttribute('aria-hidden', 'true');
  return {
    run, host, pane, stage, code, column, lines, caret, headline, sky, canvas,
    prog: prepare(run.program.text),
    stream: null,
    sim: null,
    scale: 1,
    visible: true,
    last: {}
  };
}

function setText(p, key, node, value) {
  if (p.last[key] !== value) { node.textContent = value; p.last[key] = value; }
}
function setStyle(p, key, node, prop, value) {
  if (p.last[key] !== value) { node.style.setProperty(prop, value); p.last[key] = value; }
}

// ---------- counters ----------
// A muted state word, then its value. Once a model finishes, its total output stays in front of the flying timer.
// Numbers don't jiggle: every character sits in its own fixed-width cell (a digit is 0.64 em, the width of
// Anthropic Sans's tabular figures; a comma or point is 0.236 em), filled from the right. Browsers round
// glyph positions to whole pixels, so plain tabular figures still shift by a pixel as digits change.
const fmtInt = (n) => Math.round(n).toLocaleString('en-US');
const NUMBER_CELLS = 6;

function setNumber(r, text) {
  if (r.last.numText === text) return;
  r.last.numText = text;
  const chars = [...text];
  r.cells.forEach((cell, i) => {
    const ch = chars[chars.length - r.cells.length + i] || '';
    const kind = ch === '' ? '' : /[0-9]/.test(ch) ? ' mr-cell--digit' : ' mr-cell--sep';
    if (cell.textContent !== ch) cell.textContent = ch;
    if (cell.className !== 'mr-cell' + kind) cell.className = 'mr-cell' + kind;
    if (cell.hidden !== !ch) cell.hidden = !ch;
  });
}

function buildReadout(host) {
  const root = el('span', 'mr-readout', host);
  const total = el('span', 'mr-readout-total', root);
  el('span', 'mr-readout-word', total).textContent = 'Output';
  const totalValue = el('span', 'mr-readout-value', total);
  const word = el('span', 'mr-readout-word', root);
  const value = el('span', 'mr-readout-value', root);
  const num = el('span', 'mr-readout-num', value);
  const cells = [];
  for (let i = 0; i < NUMBER_CELLS; i++) { const cell = el('span', 'mr-cell', num); cell.hidden = true; cells.push(cell); }
  const unit = el('span', 'mr-readout-unit', value);
  total.hidden = true;
  return { root, total, totalValue, word, num, cells, unit, last: {} };
}

// words: { runningWord, counter }. runningWord is the word once a program is on screen ("Flying", "Running").
// counter 'took' shows how long the model took in real time ("Done in 26.8 s") instead of a running timer,
// for something that just sits there, like a page.
function renderReadout(r, m, fade, words) {
  const set = (key, node, value) => { if (r.last[key] !== value) { node.textContent = value; r.last[key] = value; } };
  const style = (key, node, prop, value) => { if (r.last[key] !== value) { node.style.setProperty(prop, value); r.last[key] = value; } };
  const flying = m.phase === 'flying';
  if (r.total.hidden !== !flying) r.total.hidden = !flying;
  set('total', r.totalValue, `${fmtInt(m.totalTokens)} tokens`);
  const took = words.counter === 'took';
  // Thinking played faster than real time says so.
  const fast = m.thinkingSpeed > 1 ? ` ${+m.thinkingSpeed.toFixed(1)}\u00d7` : '';
  set('word', r.word, flying ? (took ? 'Done in' : words.runningWord) : m.phase === 'thinking' ? 'Thinking' + fast : 'Writing');
  const seconds = (took ? m.realSeconds : m.flyingSeconds).toFixed(1);
  setNumber(r, flying ? seconds : fmtInt(m.tokens));
  set('unit', r.unit, flying ? ' s' : ' tokens');
  // Fixed slots, so the words beside the number never move: room for 00.0 and 0,000, or more if this run needs it.
  const widthOf = (text) => [...text].reduce((w, ch) => w + (/[0-9]/.test(ch) ? 0.64 : 0.236), 0);
  const slot = flying ? Math.max(2.156, widthOf(seconds)) : Math.max(2.796, widthOf(fmtInt(m.totalTokens)));
  style('slot', r.num, 'width', +slot.toFixed(3) + 'em');
  style('fade', r.root, 'opacity', fade.toFixed(3));
}

// The built-in murmuration flies. Anything else runs, unless its record says otherwise.
const wordsOf = (options) => ({ runningWord: options.runningWord || (options.runs && options.runs !== RUNS ? 'Running' : 'Flying'), counter: options.counter || 'running' });

// 'hh:mm:ss' -> that time on a Thursday in October, in the viewer's own time zone.
function epochOf(clock) {
  const [h, m, s] = String(clock || DEFAULT_CLOCK).split(':').map(Number);
  return new Date(2026, 9, 1, h || 0, m || 0, s || 0).getTime();
}

// ---------- shared clock ----------
function createRace(targets, options) {
  const timing = Object.assign({}, TIMING, options.timing);
  const reduced = options.reducedMotion ?? (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const builtIn = !options.runs || options.builtIn === true;
  const words = options.words || wordsOf(options);
  const epoch = epochOf(options.clock);
  const panes = targets.map(({ run, host }) => buildPane(run, host));
  panes.forEach((p) => {
    if (options.paneLabels === false) p.pane.setAttribute('aria-hidden', 'true');
    else {
      p.pane.setAttribute('role', 'img');
      p.pane.setAttribute('aria-label', `${p.run.label} writes ${builtIn ? 'a starling murmuration program' : 'a program'}, then runs it.`);
    }
  });

  // The timeline covers every run in RUNS, so a page showing one pane keeps the same loop.
  const allRuns = options.runs || RUNS;
  const finish = finishOf;
  const skip = timing.skipSeconds || 0;
  const raceCycle = cycleOf(allRuns, timing);   // seconds since the prompt was sent
  const cycle = raceCycle - skip;                // loop length
  const readoutHosts = options.readouts || {};
  const readouts = allRuns.filter((run) => readoutHosts[run.id]).map((run) => ({ id: run.id, r: buildReadout(readoutHosts[run.id]) }));

  function fit() {
    panes.forEach((p) => {
      const width = p.pane.clientWidth || PANE_W;
      p.scale = width / PANE_W;
      p.stage.style.transform = `scale(${p.scale})`;
    });
  }
  fit();
  const resizer = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(fit) : null;
  if (resizer) panes.forEach((p) => resizer.observe(p.pane));

  // loopT: seconds into the loop. t: seconds since the prompt was sent.
  // capped: from the animation loop, so a slow device steps the programs at most MAX_STEPS_PER_FRAME times a frame.
  // A seek always steps fully, so frames are exact.
  function render(loopT, capped) {
    let anyRunning = false;
    const t = loopT + skip;
    const endU = clamp01((t - (raceCycle - timing.endRestSeconds - timing.endWipeSeconds)) / timing.endWipeSeconds);
    const envelope = Math.min(easeOut(loopT / timing.startFadeSeconds), 1 - easeOut(endU));
    if (readouts.length) {
      const state = raceStateAt(loopT, { runs: allRuns, timing });
      readouts.forEach(({ id, r }) => renderReadout(r, state.models.find((m) => m.id === id), state.fade, words));
    }

    panes.forEach((p) => {
      const run = p.run;
      const fin = finish(run);
      const emitted = tokensAt(run, t);
      const thinking = t < run.firstTokenSeconds || emitted < run.thinkingTokens;
      const done = t >= fin;
      const since = t - fin;

      // Code view: wrapped rows that glide up as they arrive; the newest characters fade in.
      if (!p.stream) {
        p.stream = makeStream(p.prog, { ttft: run.firstTokenSeconds, think: run.thinkingTokens, output: run.outputTokens, rate: run.tokensPerSecond, thinkRate: thinkRateOf(run) }, CODE_LAYOUT);
      }
      const sv = p.stream.view(t);
      const blink = !thinking || Math.floor(t * 2 / timing.playback) % 2 === 0;

      // While thinking: the run's thinking headlines, one at a time. The code fades in as writing starts.
      const codeStart = codeStartOf(run);
      const hl = headlineView(t, run.headlines, run.firstTokenSeconds, codeStart, timing.playback);
      const colOpacity = run.headlines ? Math.max(0, Math.min(1, (t - codeStart) / 0.2)) : 1;
      setText(p, 'hlText', p.headline, hl.text);
      setStyle(p, 'hlOpacity', p.headline, 'opacity', (hl.opacity * envelope).toFixed(3));
      setStyle(p, 'hlDy', p.headline, 'transform', `translateY(${hl.dy.toFixed(2)}px)`);
      setStyle(p, 'hlA', p.headline, '--mr-shine-a', `${hl.a.toFixed(1)}%`);
      setStyle(p, 'hlB', p.headline, '--mr-shine-b', `${hl.b.toFixed(1)}%`);
      setStyle(p, 'hlC', p.headline, '--mr-shine-c', `${hl.c.toFixed(1)}%`);
      setStyle(p, 'colOpacity', p.column, 'opacity', colOpacity.toFixed(3));
      setStyle(p, 'scroll', p.column, 'transform', `translateY(${sv.scrollPx.toFixed(2)}px)`);
      let caretHost = null;
      p.lines.forEach((slotEl, k) => {
        const row = sv.rows[k];
        if (!row) { if (!slotEl.line.hidden) slotEl.line.hidden = true; return; }
        if (slotEl.line.hidden) slotEl.line.hidden = false;
        const key = row.no + '|' + row.kind + '|' + row.segs.join('\u0000');
        if (slotEl.key !== key) {
          slotEl.no.textContent = row.no;
          slotEl.text.dataset.kind = row.kind;
          row.segs.forEach((seg, s) => { if (slotEl.segs[s].textContent !== seg) slotEl.segs[s].textContent = seg; });
          slotEl.key = key;
        }
        if (row.last) caretHost = slotEl.text;
      });
      if (!done && blink && caretHost && colOpacity > 0) { if (p.caret.parentNode !== caretHost) caretHost.appendChild(p.caret); }
      else if (p.caret.parentNode) p.caret.remove();
      setStyle(p, 'codeOpacity', p.code, 'opacity', done && since >= timing.revealSeconds ? '0' : envelope.toFixed(3));

      // Program window: wipes down when the model finishes, back up before the loop restarts.
      const clip = done ? 100 * Math.max(1 - easeOut(since / timing.revealSeconds), easeIn(endU)) : 100;
      setStyle(p, 'clip', p.sky, 'clip-path', `inset(0 0 ${clip.toFixed(2)}% 0)`);
      if (done) { advanceProgram(p, since, capped); anyRunning = true; }
      else if (run.program.page && t >= fin - PAGE_LEAD) advanceProgram(p, 0, capped);   // load it ahead, out of sight
      else dropProgram(p);
    });
    return anyRunning;
  }

  function dropProgram(p) {
    if (p.sim && p.sim.destroy) p.sim.destroy();
    p.sim = null;
  }

  function advanceProgram(p, seconds, capped) {
    const target = Math.min(MAX_STEPS, Math.floor(seconds * STEPS_PER_SECOND));
    if (p.run.program.page) {
      // A whole page, in its own sandboxed frame. It steps on this clock, a message at a time.
      if (!p.sim || p.sim.steps > target) {
        const zoom = options.pageZoom || PAGE_ZOOM;
        dropProgram(p);
        p.sim = startPage(p.run.program, { seed: p.run.seed, clock: options.clock || DEFAULT_CLOCK, scroll: options.pageScroll ?? PAGE_SCROLL }, p.sky, PANE_W / zoom, PANE_H / zoom);
        p.sim.frame.style.transform = `scale(${zoom})`;
        p.canvas.hidden = true;
      }
      p.sim.advance(target, capped ? MAX_STEPS_PER_FRAME : Infinity);
      return;
    }
    if (!p.sim || p.sim.steps > target) {
      const dpr = window.devicePixelRatio || 1;
      const backing = Math.max(1, Math.min(3, Math.ceil(dpr * p.scale * 4) / 4));
      p.sim = startProgram(p.run.program, p.run.seed, p.canvas, PANE_W, PANE_H, backing, epoch);
    }
    // On a device that can't keep up, the program falls a little behind real time (the birds slow down slightly)
    // instead of trying to catch up in one frame and stuttering. It catches up again when the device can.
    let budget = capped ? MAX_STEPS_PER_FRAME : Infinity;
    while (p.sim.steps < target && budget-- > 0) p.sim.step();
  }

  // Playback loop. Pauses when every pane is off screen, or when the tab is hidden (rAF stops by itself).
  let t = 0;
  let prev = null;
  let raf = 0;
  let playing = !reduced;
  const onScreen = () => panes.some((p) => p.visible);

  // Slow-device check: if drawing takes too long while the programs run, tell options.onSlow once.
  const slowMs = options.slowMs ?? 20;
  let costs = [];
  let slowReported = false;

  function frame(now) {
    raf = 0;
    if (prev !== null) t += Math.min(Math.max(now - prev, 0), 100) / 1000 * timing.playback;
    prev = now;
    if (t > cycle) t = 0;
    const started = performance.now();
    const running = render(t, true);
    if (running && options.onSlow && !slowReported) {
      costs.push(performance.now() - started);
      if (costs.length >= 60) {
        const average = costs.reduce((a, b) => a + b, 0) / costs.length;
        costs = [];
        if (average > slowMs) { slowReported = true; options.onSlow(average); }
      }
    }
    schedule();
  }
  function schedule() {
    if (!raf && playing && onScreen()) raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    prev = null;
  }

  const io = typeof IntersectionObserver !== 'undefined'
    ? new IntersectionObserver((entries) => {
      entries.forEach((e) => { const p = panes.find((x) => x.pane === e.target); if (p) p.visible = e.isIntersecting; });
      if (onScreen()) schedule(); else stop();
    })
    : null;
  if (io) panes.forEach((p) => io.observe(p.pane));

  if (reduced) render(Math.min(timing.stillAt, cycle));
  else { render(0); schedule(); }

  return {
    cycle,
    get time() { return t; },
    play() { playing = true; schedule(); },
    pause() { playing = false; stop(); },
    // capped: step the programs as the animation loop does, a few steps a frame, so a page that drives
    // the race from its own clock never stalls a frame catching up after a jump (a long pause, a hidden tab).
    seek(seconds, capped) { t = Math.max(0, Math.min(cycle, seconds)); render(t, !!capped); },
    // A page steps in its own frame, so it lands a moment after a seek. Await this for an exact frame (video renders do).
    settle() { return Promise.all(panes.map((p) => (p.sim && p.sim.reached ? p.sim.reached(p.sim.want) : null))); },
    destroy() {
      stop();
      panes.forEach(dropProgram);
      if (io) io.disconnect();
      if (resizer) resizer.disconnect();
      panes.forEach((p) => p.pane.remove());
      readouts.forEach(({ r }) => r.root.remove());
    }
  };
}

// ---------- entry points ----------

// Only the pane contents, one per box you pass, keyed by run id ('previous', 'latest').
// Each pane fills its box's width at 16:9. All panes share one clock, so they stay in step.
// Pass { readouts: { previous: el, latest: el } } to fill your own label row with the counters.
function mountMurmurationPanes(boxes, options = {}) {
  const runs = normalizeRuns(options.runs || RUNS);
  options = Object.assign({}, options, { runs, builtIn: !options.runs, words: wordsOf(options) });
  const targets = runs.filter((run) => boxes[run.id]).map((run) => ({ run, host: boxes[run.id] }));
  if (!targets.length) throw new Error('mountMurmurationPanes: pass at least one box, keyed by ' + runs.map((r) => `'${r.id}'`).join(' or '));
  return createRace(targets, options);
}

// The full comparison's layout: the one-line prompt, then a label row above each box (name on the left, counters on
// the right), previous model on the left, latest on the right, and a dot only on the latest. Stacks below 640 px.
function buildLayout(container, runs, options) {
  // Built-in runs use PROMPT_SUMMARY; pass promptSummary with your own runs, or showPrompt: false to leave it out.
  const promptText = options.showPrompt === false ? null : (options.promptSummary ?? (options.runs ? null : PROMPT_SUMMARY));
  const root = el('div', 'mr');
  root.setAttribute('role', 'img');
  root.setAttribute('aria-label', options.label || (promptText
    ? `Two models answer the same prompt: ${promptText}. Each writes its program, then runs it. The latest finishes first.`
    : DEFAULT_LABEL));
  let prompt = null;
  if (promptText) {
    prompt = el('div', 'mr-prompt', root);
    el('span', 'mr-prompt-label', prompt).textContent = 'Prompt:';
    prompt.append(promptText);
  }
  // Keep the prompt on one line: on narrow screens, shrink it until it fits (down to 12 px), then cut it with an ellipsis.
  const fitPrompt = () => {
    if (!prompt) return;
    prompt.style.fontSize = '';
    let size = parseFloat(getComputedStyle(prompt).fontSize);
    while (prompt.scrollWidth > prompt.clientWidth + 0.5 && size > 12) {
      size -= 0.5;
      prompt.style.fontSize = size + 'px';
    }
  };
  const columns = el('div', 'mr-columns', root);
  const rows = {};
  const boxes = {};
  for (const run of runs) {
    const column = el('div', 'mr-column', columns);
    const row = el('div', 'mr-label-row', column);
    const label = el('div', 'mr-label' + (run.latest ? ' mr-label--latest' : ''), row);
    if (run.latest) {
      const dot = el('span', 'mr-label-dot', label);
      dot.style.setProperty('--mr-model', run.color);
    }
    el('span', 'mr-label-text', label).textContent = run.label;
    rows[run.id] = row;
    boxes[run.id] = el('div', 'mr-box', column);
  }
  container.appendChild(root);
  fitPrompt();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPrompt);
  const resizer = prompt && typeof ResizeObserver !== 'undefined' ? new ResizeObserver(fitPrompt) : null;
  if (resizer) resizer.observe(root);
  return {
    root, rows, boxes,
    readouts: options.counters === false ? {} : rows,
    destroy() { if (resizer) resizer.disconnect(); root.remove(); }
  };
}

// The full comparison, drawn live.
function mountMurmurationRace(container, options = {}) {
  const runs = normalizeRuns(options.runs || RUNS);
  const layout = buildLayout(container, runs, options);
  const targets = runs.map((run) => ({ run, host: layout.boxes[run.id] }));
  const race = createRace(targets, Object.assign({}, options, { runs, builtIn: !options.runs, words: wordsOf(options), paneLabels: false, readouts: layout.readouts }));
  const destroyPanes = race.destroy;
  race.destroy = () => { destroyPanes(); layout.destroy(); };
  return race;
}

// The two per-model videos in boxes you give, kept on one timeline, with counters in the rows you give.
// videos: { previous: { src, poster }, latest: { src, poster } }. The first run's video leads; the other
// follows it, and both restart together. Pauses off screen. With reduced motion, shows the posters and still counters.
function mountVideoPanes(boxes, rows, runs, options) {
  const timing = Object.assign({}, TIMING, options.timing);
  const reduced = options.reducedMotion ?? (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const cycle = raceStateAt(0, { runs, timing }).cycle;
  const items = runs.filter((run) => boxes[run.id] && options.videos && options.videos[run.id]).map((run) => {
    const v = options.videos[run.id];

// Recommended integration: the full comparison, drawn live on every screen, phones included (it's about 80 KB,
// against about 25 MB of video). With reduced motion it shows one still frame.
// Optional fallback: pass options.videos ({ previous: { src, poster }, latest: { src, poster } }) and, if a
// device is too slow to draw live (options.slowMs, default 20 ms a frame), the panes swap to the two per-model videos
// at the same moment of the loop, kept in sync. options.mode: 'live' (default) or 'video' to force the videos.

  const runs = normalizeRuns(options.runs || RUNS);

  const hasVideos = !!(options.videos && runs.every((run) => options.videos[run.id]));

  let mode = options.mode === 'video' && hasVideos ? 'video' : 'live';

  let current = null;

  const mountVideo = (at) => {
    current = mountVideoPanes(layout.boxes, layout.readouts, runs, Object.assign({}, options, { reducedMotion: reduced, words: wordsOf(options) }));

  };

    pause() { paused = true; current.pause(); },

// Counters only, for pages that show the two per-model videos. Reads the time from `currentTime`
// (seconds, for example () => video.currentTime) on every animation frame.
function mountMurmurationReadouts(hosts, options = {}) {
  const runs = options.runs || RUNS;

// (docs/HOSTED-ARTIFACTS.md in the website repo). The race engine draws the pane and
// its counters; the reference listener's clock says which moment to draw.
//
// Under the block (?protocol=model-comparison) the page starts paused on its first
// frame, tells the block it's ready, then plays and pauses on the block's messages.
// Opened any other way, it plays by itself, looping.

// made with the loop length the page states.
function mountPane(side, comparison, programs, makeClock) {
  const options = optionsFromComparison(comparison, programs);
  if (!options.runs.some((run) => run.id === side)) throw new Error(`mountPane: no run called ${side}`);

  // The loop covers both runs, so each side starts over when the other does.
  const cycle = raceStateAt(0, options).cycle;
  if (Math.abs(cycle - comparison.loopSeconds) > 0.01) {
    throw new Error(`mountPane: the race loops every ${cycle.toFixed(2)} s, not ${comparison.loopSeconds} s`);
  }

  let race = null;
  let raf = 0;
  let visible = true;
  const clock = makeClock(sync);

  // Under the block, reduced motion is the block's call: it shows the poster until the
  // reader presses play. Opened directly, the page honours the setting with one still frame.
  const still = !clock.controlled && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const paneBox = document.getElementById('pane');
  race = mountMurmurationPanes({ [side]: paneBox }, Object.assign({}, options, {
    readouts: { [side]: document.getElementById('counters') },
    reducedMotion: still,
  }));
  // The page, not the engine, decides when to draw.
  race.pause();

  // Capped: after a jump (a hidden tab, a long pause) the program catches up a few steps a frame.
  const draw = () => race.seek(clock.time(), true);

  function frame() {
    raf = 0;
    draw();
    if (clock.playing() && visible) raf = requestAnimationFrame(frame);
  }

  // After a play or pause, or a change in visibility: draw the moment now, then run or stop the loop.
  function sync() {

    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    draw();
    if (clock.playing() && visible) raf = requestAnimationFrame(frame);

  // when it comes back (on a phone, when the reader switches to this side).
  if (typeof IntersectionObserver !== 'undefined') {
    new IntersectionObserver((entries) => {
      visible = entries.some((entry) => entry.isIntersecting);
      sync();
    }).observe(paneBox);
  }

  // The engine drew the first frame as it mounted, synchronously. Tell the block now, never from
  // an animation frame: a page waiting to be shown is hidden, and a hidden page gets none.
  clock.ready();
  sync();
}
