<!doctype html>
<meta charset="utf-8">
<title>Identity correlation: linking accounts that belong to the same person</title>
<style>
:root{--bg:#fbfaf7;--ink:#161616;--ink2:#5a5955;--ink3:#8d8b85;--grid:#e3e1da;--axis:#8d8b85;--card:#ffffff;--rule:#e3e1da;--accent:#b4533a;--sep:#b9b7b0}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
h1{font-weight:500;font-size:22px;margin:0 0 4px;text-wrap:balance}
p.sub{margin:0 0 18px;color:var(--ink2);max-width:90ch}
figure{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 16px 12px}
figure h2{font-weight:500;font-size:18px;margin:0 0 2px;text-align:center;text-wrap:balance}
figure .pt{font-size:14px;color:var(--accent);text-align:center;margin:14px 0 2px}
.svgwrap{overflow-x:auto}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--ink);font-family:inherit}
svg .t2{fill:var(--ink2)} svg .t3{fill:var(--ink3)}
svg .grid{stroke:var(--grid);stroke-dasharray:3 3} svg .axis{stroke:var(--axis)} svg .sep{stroke:var(--sep);stroke-dasharray:2 3}
figcaption{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12.5px;color:var(--ink2);margin:6px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px} .legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
.picker{border-bottom:1px solid var(--rule);padding:10px 0 10px;margin:8px 0 4px}
.picker .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0}
.picker .lbl{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;min-width:112px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 8px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;line-height:1.3}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.chip[aria-pressed="false"]{color:var(--ink3)} .chip[aria-pressed="false"] i{background:transparent}
.chip:hover{border-color:var(--ink3)} .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.picker .acts{margin-left:auto;display:flex;gap:4px}
.picker .acts button{font:inherit;font-size:12px;color:var(--ink2);background:none;border:0;cursor:pointer;padding:3px 6px;border-radius:5px;text-decoration:underline dotted}
.picker .acts button:hover{color:var(--ink)}
.empty{fill:var(--ink3);font-size:14px}
.svgwrap{position:relative}
svg .series{transition:opacity .15s} svg .series .hit{fill:transparent;stroke:none;cursor:pointer}
svg.focused .series:not(.focus){opacity:.14} svg.focused .series.focus polyline{stroke-width:3.2}
svg.focused rect.bar:not(.focus){opacity:.22} svg.focused text.bar:not(.focus){opacity:.35}
.legend span{cursor:pointer;border-radius:5px;padding:1px 5px;margin:-1px -5px} .legend span:hover{background:var(--grid)}
.legend.focused span:not(.focus){opacity:.4} .legend span.pinned{background:var(--grid);color:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tip b{font-weight:600} .tip.show{opacity:1}
.hint{font-size:12px;color:var(--ink3);text-align:center;margin:4px 0 0}
.legend i.sw{width:12px;height:12px;border-radius:2px} .legend i.wh{width:2px;height:12px;border-radius:0;background:var(--ink2)} .legend i.dash{width:22px;height:0;border-top:2px dashed var(--ink2);background:none;border-radius:0}
.picker .view .chip[aria-pressed="true"]{background:var(--grid)}
svg.focused line.bar:not(.focus){opacity:.22}
</style>
<main>
<figure id="fig"><h2>Identity correlation: linking accounts that belong to the same person</h2>
<section class="picker" aria-label="Choose models to compare">
<div class="row"><span class="lbl">Claude models</span><span id="pick-claude" class="row" style="margin:0"></span><span class="acts"><button type="button" data-act="all">Select all</button><button type="button" data-act="none">Clear</button><button type="button" data-act="reset">Reset</button></span></div>
<div class="row"><span class="lbl">Open-weights</span><span id="pick-open" class="row" style="margin:0"></span></div>
<div class="row view"><span class="lbl">View</span><button type="button" class="chip" data-view="tier" aria-pressed="true">By difficulty tier</button><button type="button" class="chip" data-view="pooled" aria-pressed="false">All tiers pooled</button></div>
</section>
<div class="pt" id="pt">Linkage F1 by difficulty tier — higher is better</div><div class="svgwrap"><svg id="chart" viewBox="0 0 1100 400"></svg></div><div class="legend" id="legend"></div>
<p class="hint">Hover a bar for its value and interval; click a bar to spotlight that model (click again or press Esc to release).</p>
<figcaption>n = 18 / 16 / 16 samples per model (easy / medium / hard; 50 pooled); the theoretical maximum is below 1 because some accounts never post, so even a perfect solver cannot link them. Where shown, Opus 4.5 and 4.6 used a fixed 12k-token thinking budget; all other models used adaptive thinking.</figcaption></figure>
</main>
<script>
const DEFAULT_HIDDEN = new Set(["Opus 4.5", "Opus 4.6", "Opus 4.7", "Opus 4.8"]);
const ORDER_IDENT = {"claude": ["Sonnet 5", "Opus 4.5", "Opus 4.6", "Opus 4.7", "Opus 4.8", "Opus 5", "Mythos Preview", "Mythos 5"], "open": ["Kimi K3"]};
const IC = {"label": "Linkage F1 (every ground-truth account counted)", "values": {"Sonnet 5": {"easy": {"mean": 0.596944, "lo": 0.565774, "hi": 0.628115, "n": 18}, "medium": {"mean": 0.544731, "lo": 0.517961, "hi": 0.571501, "n": 16}, "hard": {"mean": 0.222979, "lo": 0.167992, "hi": 0.277966, "n": 16}, "pooled": {"mean": 0.460567, "lo": 0.409513, "hi": 0.511622, "n": 50}}, "Opus 4.5": {"easy": {"mean": 0.601715, "lo": 0.570105, "hi": 0.633325, "n": 18}, "medium": {"mean": 0.560927, "lo": 0.538924, "hi": 0.58293, "n": 16}, "hard": {"mean": 0.379852, "lo": 0.358563, "hi": 0.401141, "n": 16}, "pooled": {"mean": 0.517667, "lo": 0.487016, "hi": 0.548317, "n": 50}}, "Opus 4.6": {"easy": {"mean": 0.609689, "lo": 0.577773, "hi": 0.641605, "n": 18}, "medium": {"mean": 0.615977, "lo": 0.594324, "hi": 0.63763, "n": 16}, "hard": {"mean": 0.520737, "lo": 0.501071, "hi": 0.540404, "n": 16}, "pooled": {"mean": 0.583237, "lo": 0.564377, "hi": 0.602096, "n": 50}}, "Opus 4.7": {"easy": {"mean": 0.592054, "lo": 0.558858, "hi": 0.62525, "n": 18}, "medium": {"mean": 0.591254, "lo": 0.562929, "hi": 0.61958, "n": 16}, "hard": {"mean": 0.380109, "lo": 0.353158, "hi": 0.40706, "n": 16}, "pooled": {"mean": 0.523976, "lo": 0.491556, "hi": 0.556395, "n": 50}}, "Opus 4.8": {"easy": {"mean": 0.596057, "lo": 0.563011, "hi": 0.629104, "n": 18}, "medium": {"mean": 0.574825, "lo": 0.550411, "hi": 0.599239, "n": 16}, "hard": {"mean": 0.13776, "lo": 0.104695, "hi": 0.170825, "n": 16}, "pooled": {"mean": 0.442608, "lo": 0.381481, "hi": 0.503735, "n": 50}}, "Opus 5": {"easy": {"mean": 0.61328, "lo": 0.581462, "hi": 0.645097, "n": 18}, "medium": {"mean": 0.636335, "lo": 0.613014, "hi": 0.659657, "n": 16}, "hard": {"mean": 0.557415, "lo": 0.533479, "hi": 0.58135, "n": 16}, "pooled": {"mean": 0.602781, "lo": 0.584925, "hi": 0.620637, "n": 50}}, "Mythos Preview": {"easy": {"mean": 0.616443, "lo": 0.586227, "hi": 0.646658, "n": 18}, "medium": {"mean": 0.650362, "lo": 0.629391, "hi": 0.671334, "n": 16}, "hard": {"mean": 0.599165, "lo": 0.576936, "hi": 0.621393, "n": 16}, "pooled": {"mean": 0.621768, "lo": 0.606287, "hi": 0.637249, "n": 50}}, "Mythos 5": {"easy": {"mean": 0.615444, "lo": 0.583345, "hi": 0.647544, "n": 18}, "medium": {"mean": 0.6409, "lo": 0.61983, "hi": 0.66197, "n": 16}, "hard": {"mean": 0.57786, "lo": 0.556041, "hi": 0.59968, "n": 16}, "pooled": {"mean": 0.611563, "lo": 0.595152, "hi": 0.627975, "n": 50}}, "Kimi K3": {"easy": {"mean": 0.607606, "lo": 0.576493, "hi": 0.638718, "n": 18}, "medium": {"mean": 0.620373, "lo": 0.59634, "hi": 0.644406, "n": 16}, "hard": {"mean": 0.521652, "lo": 0.495522, "hi": 0.547782, "n": 16}, "pooled": {"mean": 0.584186, "lo": 0.564417, "hi": 0.603955, "n": 50}}}, "reference": {"label": "theoretical maximum", "values": {"easy": 0.636, "medium": 0.7017, "hard": 0.7669, "pooled": 0.6989}}};
const COLOR={"Sonnet 5":"#74bdf2","Opus 4.5":"#b3dec9","Opus 4.6":"#86cbae","Opus 4.7":"#55b38f","Opus 4.8":"#2a9670","Opus 5":"#0c7350","Mythos Preview":"#8a6dc4","Mythos 5":"#47267f","Kimi K3":"#4a5563"};
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;parent&&parent.appendChild(e);return e}
let hovered=null, pinned=null;
function tipFor(svg){const w=svg.parentElement;let t=w.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";w.appendChild(t)}return t}
function showTip(svg,e,html){const t=tipFor(svg),w=svg.parentElement,r=w.getBoundingClientRect();t.innerHTML=html;t.classList.add("show");
  const x=e.clientX-r.left+w.scrollLeft, y=e.clientY-r.top; const tw=t.offsetWidth;
  t.style.left=Math.min(x+14,w.scrollWidth-tw-4)+"px"; t.style.top=(y-t.offsetHeight-12<0?y+16:y-t.offsetHeight-12)+"px"}
function hideTip(svg){tipFor(svg).classList.remove("show")}
function hover(n){hovered=n;applyFocus()}
function pin(n){pinned=(n===null||pinned===n)?null:n;applyFocus()}
function applyFocus(){const f=pinned||hovered;
  document.querySelectorAll("svg").forEach(s=>s.classList.toggle("focused",!!f));
  document.querySelectorAll(".legend").forEach(l=>l.classList.toggle("focused",!!f));
  document.querySelectorAll("[data-model]").forEach(x=>{x.classList.toggle("focus",!!f&&x.dataset.model===f);x.classList.toggle("pinned",!!pinned&&x.dataset.model===pinned)})}
document.addEventListener("keydown",e=>{if(e.key==="Escape")pin(null)});
function makePicker(ORDER,STORE,render){
  const ALL_CLAUDE=[...ORDER.claude].reverse(), ALL_OPEN=[...ORDER.open].reverse(), ALL=[...ALL_CLAUDE,...ALL_OPEN];
  const defaults=()=>new Set(ALL.filter(n=>!DEFAULT_HIDDEN.has(n)));
  window.selected=defaults();
  try{const v=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(v))selected=new Set(v.filter(n=>ALL.includes(n)))}catch{}
  const save=()=>{try{localStorage.setItem(STORE,JSON.stringify([...selected]))}catch{}};
  const chipRow=(id,list)=>{const host=document.getElementById(id);host.innerHTML="";list.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.model=n;b.style.setProperty("--c",COLOR[n]);b.innerHTML=`<i></i>${n}`;b.addEventListener("click",()=>{selected.has(n)?selected.delete(n):selected.add(n);save();rerender()});host.appendChild(b)})};
  chipRow("pick-claude",ALL_CLAUDE);chipRow("pick-open",ALL_OPEN);
  const rerender=()=>{document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(selected.has(b.dataset.model))));render()};
  document.querySelectorAll(".picker .acts button").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.act;selected=a==="all"?new Set(ALL):a==="none"?new Set():defaults();save();rerender()}));
  rerender();
}


const TIERS=["easy","medium","hard"], TINT={easy:.55,medium:.30,hard:0}, DASH={easy:"3 4",medium:"8 5",hard:"14 5 3 5"};
const TIER_STYLE="solid";
const TIER_BLUES={easy:"#9ecae1",medium:"#4292c6",hard:"#08519c"};
const tint=(hex,t)=>"#"+[1,3,5].map(i=>{const c=parseInt(hex.slice(i,i+2),16);return Math.round(c+t*(255-c)).toString(16).padStart(2,"0")}).join("");
const tierFill=(nm,t)=>TIER_STYLE==="blues"?TIER_BLUES[t]:TIER_STYLE==="tint"?tint(COLOR[nm],TINT[t]):COLOR[nm];
const TIER_SHORT={easy:"easy",medium:"med",hard:"hard"};
let VIEW="tier";
function tierBars(svgId,legendId,D,order,opts){
  const svg=document.getElementById(svgId); svg.innerHTML="";
  const tiered=VIEW==="tier";
  const tiered0=VIEW==="tier", labelTiers=tiered0&&TIER_STYLE==="solid";
  const W=1100,H=opts.H+(labelTiers?12:0),m={l:70,r:96,t:30,b:labelTiers?60:48},pw=W-m.l-m.r,ph=H-m.t-m.b;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const Y=v=>m.t+ph-(v/opts.ymax)*ph;
  for(let g=0;g<=opts.ymax+1e-9;g+=0.2){el("line",{x1:m.l,x2:m.l+pw,y1:Y(g),y2:Y(g),class:"grid"},svg);el("text",{x:m.l-8,y:Y(g)+4,"text-anchor":"end","font-size":12,class:"t2"},svg,g.toFixed(1))}
  el("line",{x1:m.l,x2:m.l,y1:m.t,y2:m.t+ph,class:"axis"},svg);el("line",{x1:m.l,x2:m.l+pw,y1:m.t+ph,y2:m.t+ph,class:"axis"},svg);
  el("text",{x:16,y:m.t+ph/2,"text-anchor":"middle","font-size":13,transform:`rotate(-90 16 ${m.t+ph/2})`},svg,D.label);
  const cl=order.claude.filter(n=>selected.has(n)), op=order.open.filter(n=>selected.has(n));
  const names=[...cl,...op], n=names.length, both=cl.length&&op.length, gap=both?0.6:0, slot=n?pw/(n+gap):pw;
  const bw=tiered?Math.min(slot*0.27,46):Math.min(slot*0.58,110);
  const cx=i=>m.l+slot*(i+0.5)+(i>=cl.length?slot*gap:0);
  if(!n)el("text",{x:m.l+pw/2,y:m.t+ph/2,"text-anchor":"middle",class:"empty"},svg,"No models selected");
  const sepX=m.l+slot*cl.length+slot*gap/2;
  if(both)el("line",{x1:sepX,x2:sepX,y1:m.t,y2:m.t+ph,class:"sep"},svg);
  if(cl.length)el("text",{x:both?(m.l+sepX)/2:m.l+pw/2,y:m.t+16,"text-anchor":"middle","font-size":12.5,class:"t2"},svg,"Claude models");
  if(op.length){const wide=!both||(m.l+pw-sepX)>150; el("text",{x:both?(wide?(sepX+m.l+pw)/2:sepX+8):m.l+pw/2,y:m.t+16,"text-anchor":wide?"middle":"start","font-size":12.5,class:"t2"},svg,"Open-weights models");}
  const refs=tiered?TIERS.map(t=>[t,D.reference.values[t]]):(D.reference.values.pooled!=null?[["",D.reference.values.pooled]]:[]);
  refs.forEach(([t,v])=>{el("line",{x1:m.l,x2:m.l+pw,y1:Y(v),y2:Y(v),stroke:"var(--ink2)","stroke-width":2,"stroke-dasharray":t?DASH[t]:"6 4",opacity:.85},svg);
    el("text",{x:m.l+pw+6,y:Y(v)+4,"font-size":11,class:"t3"},svg,`${t||opts.refWord} ${opts.approx?"≈":""}${v.toFixed(2)}`)});
  const showVal=!tiered||n<=6, halo={"paint-order":"stroke",stroke:"var(--card)","stroke-width":5,"stroke-linejoin":"round"};
  const lineYs=refs.map(([t,v])=>Y(v)).sort((a,b)=>b-a), fs=tiered?10.5:12.5;
  const clearOf=y0=>{let y=y0;for(const ly of lineYs){if(ly<=y+3&&ly>=y-fs-3)y=ly-4;}return y};   // label baseline y; lift it above any line its digits would touch
  names.forEach((nm,i)=>{(tiered?TIERS.map((t,j)=>[t,j-1]):[["pooled",0]]).forEach(([t,off])=>{
      const s=D.values[nm][t], x=cx(i)+off*bw, y=Y(s.mean), col=tiered?tierFill(nm,t):COLOR[nm];
      el("rect",{x:x-bw/2+(tiered?1.5:0),y,width:bw-(tiered?3:0),height:m.t+ph-y,fill:col,stroke:COLOR[nm],"stroke-width":1,rx:1.5,class:"bar","data-model":nm},svg);
      el("line",{x1:x,x2:x,y1:Y(s.lo),y2:Y(s.hi),stroke:"var(--ink2)","stroke-width":1.3,class:"bar","data-model":nm},svg);
      [s.lo,s.hi].forEach(v=>el("line",{x1:x-3,x2:x+3,y1:Y(v),y2:Y(v),stroke:"var(--ink2)","stroke-width":1.3,class:"bar","data-model":nm},svg));
      if(showVal)el("text",{x,y:clearOf(Y(s.hi)-6),"text-anchor":"middle","font-size":fs,class:"bar","data-model":nm,...halo},svg,s.mean.toFixed(tiered?2:3));
      if(labelTiers)el("text",{x,y:m.t+ph+13,"text-anchor":"middle","font-size":9.5,class:"t3"},svg,TIER_SHORT[t]);
      const h=el("rect",{x:x-bw/2,y:m.t+20,width:bw,height:ph-20,fill:"transparent",style:"cursor:pointer","data-model":nm},svg);
      const tipHTML=`<b>${nm}</b>${tiered?" · "+t+" tier":""}<br>${s.mean.toFixed(3)} [${s.lo.toFixed(3)}, ${s.hi.toFixed(3)}] 95% CI · n = ${s.n} samples`;
      h.addEventListener("pointerenter",e=>{showTip(svg,e,tipHTML);hover(nm)});h.addEventListener("pointermove",e=>showTip(svg,e,tipHTML));
      h.addEventListener("pointerleave",()=>{hideTip(svg);hover(null)});h.addEventListener("click",e=>{e.stopPropagation();pin(nm)})});
    const lab=el("text",{x:cx(i),y:m.t+ph+(labelTiers?30:18),"text-anchor":"middle","font-size":12.5,class:"t2 bar","data-model":nm},svg);
    (n>7&&nm.length>10?nm.split(" "):[nm]).forEach((p,k)=>el("tspan",{x:cx(i),dy:k?14:0},lab,p))});
  svg.addEventListener("click",()=>pin(null));
  const leg=document.getElementById(legendId); leg.innerHTML="";
  const add=h=>{const s=document.createElement("span");s.innerHTML=h;s.style.cursor="default";leg.appendChild(s)};
  if(tiered&&TIER_STYLE==="solid"){ /* tier is labelled under every bar, so it needs no legend entry */ }
  else if(tiered)TIERS.forEach((t,i)=>add(`<i class="sw" style="background:${TIER_STYLE==="blues"?TIER_BLUES[t]:tint("#5a5955",TINT[t])}"></i>${t} tier${i==2&&TIER_STYLE!=="blues"?" (lighter to darker within each model’s colour)":""}`));
  add(`<i class="wh"></i>95% CI`);
  if(refs.length)(tiered?TIERS:[""]).forEach(t=>add(`<svg width="26" height="4" style="min-width:0;display:inline-block;width:26px"><line x1="0" x2="26" y1="2" y2="2" stroke="#5a5955" stroke-width="2" stroke-dasharray="${t?DASH[t]:"6 4"}"/></svg>${D.reference.label}${t?", "+t:""}`));
  applyFocus();
}

const PT={tier:"Linkage F1 by difficulty tier \u2014 higher is better",pooled:"Linkage F1, all tiers pooled \u2014 higher is better"};
const setView=()=>{document.getElementById("pt").textContent=PT[VIEW];document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===VIEW)))};
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{VIEW=b.dataset.view;render()}));
const render=()=>{setView();tierBars("chart","legend",IC,ORDER_IDENT,{H:400,ymax:0.9,refWord:"max",approx:false})};
makePicker(ORDER_IDENT,"identity-linkage.selected",render);
</script>
