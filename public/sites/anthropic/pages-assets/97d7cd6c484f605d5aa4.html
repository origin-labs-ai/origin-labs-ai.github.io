// ---- Hodgkin-Huxley, a line-for-line port of hh.simulate (as in the mockup) ----
function simulate(gNa, gK) {
  const { T, dt, I_amp, t_on, t_off, gL } = D.sim;
  const ENa = 50.0, EK = -77.0, EL = -54.4, C = 1.0;
  const nT = Math.trunc(T / dt);
  const a_m = V => 0.1 * (V + 40) / (1 - Math.exp(-(V + 40) / 10));
  const b_m = V => 4 * Math.exp(-(V + 65) / 18);
  const a_h = V => 0.07 * Math.exp(-(V + 65) / 20);
  const b_h = V => 1 / (1 + Math.exp(-(V + 35) / 10));
  const a_n = V => 0.01 * (V + 55) / (1 - Math.exp(-(V + 55) / 10));
  const b_n = V => 0.125 * Math.exp(-(V + 65) / 80);
  let V = -65.0;
  let m = a_m(V) / (a_m(V) + b_m(V)), h = a_h(V) / (a_h(V) + b_h(V)), n = a_n(V) / (a_n(V) + b_n(V));
  const out = new Float64Array(nT);
  for (let i = 0; i < nT; i++) {
    const t = i * dt;
    const I = (t_on <= t && t < t_off) ? I_amp : 0.0;
    const INa = gNa * m ** 3 * h * (V - ENa), IK = gK * n ** 4 * (V - EK), IL = gL * (V - EL);
    V = V + dt * (I - INa - IK - IL) / C;
    m = m + dt * (a_m(V) * (1 - m) - b_m(V) * m);
    h = h + dt * (a_h(V) * (1 - h) - b_h(V) * h);
    n = n + dt * (a_n(V) * (1 - n) - b_n(V) * n);
    out[i] = V;
  }
  return Array.from({ length: Math.ceil(nT / D.stride) }, (_, k) => out[k * D.stride]);
}

// bilinear lookup in the posterior grid P[i_gk][i_gna]
function pAt(x, y) {
  const g = D.gna, k = D.gk;

  const i = Math.max(0, Math.min(g.length - 2, Math.floor(fx)));
  const j = Math.max(0, Math.min(k.length - 2, Math.floor(fy)));
  const u = fx - i, v = fy - j;
  return (1 - u) * (1 - v) * D.P[j][i] + u * (1 - v) * D.P[j][i + 1]
       + (1 - u) * v * D.P[j + 1][i] + u * v * D.P[j + 1][i + 1];
}

// ---- scales, matching fig2.py ----
const xP = g => G.MX0 + (g - G.XL[0]) / (G.XL[1] - G.XL[0]) * (G.MX1 - G.MX0);
const yP = g => G.MY1 - (g - G.YL[0]) / (G.YL[1] - G.YL[0]) * (G.MY1 - G.MY0);
const xInv = px => G.XL[0] + (px - G.MX0) / (G.MX1 - G.MX0) * (G.XL[1] - G.XL[0]);
const yInv = py => G.YL[0] + (G.MY1 - py) / (G.MY1 - G.MY0) * (G.YL[1] - G.YL[0]);
const vy = v => G.ROW[1] - (v + 82) / 132 * (G.ROW[1] - G.ROW[0]);
function traceD(vals) {
  const n = vals.length, d = [];
  for (let i = 0; i < n; i += G.STEP)
    d.push((d.length ? "L" : "M") + (G.TX[0] + (G.TX[1] - G.TX[0]) * i / (n - 1)).toFixed(1) + " " + vy(vals[i]).toFixed(1));
  return d.join("");
}
const VY = G.VY, st = 9.5, sx = 8;   // glyph half sizes, as in fig2.verdict
const TICK = `M${G.VX - st} ${VY}L${G.VX - st * 0.3} ${VY + st * 0.7}L${G.VX + st} ${VY - st * 0.75}`;
const CROSS = `M${G.VX - sx} ${VY - sx}L${G.VX + sx} ${VY + sx}M${G.VX + sx} ${VY - sx}L${G.VX - sx} ${VY + sx}`;

// ---- interactive layer ----
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const hit = el("rect", { id: "post-hit", x: G.MX0, y: G.MY0, width: G.MX1 - G.MX0, height: G.MY1 - G.MY0, fill: "transparent" });
$("Settings").before(hit);
const old = $("Setting Highlighted");
const handle = el("g", { id: "handle", tabindex: 0, role: "slider",
  "aria-label": "Blue setting: sodium and potassium channel strength. Use arrow keys to move." });
handle.append(el("circle", { r: 24, fill: "transparent" }));      // larger touch target
const ring = el("circle", { id: "handle-ring", r: 11, fill: G.MOVABLE, stroke: "#FAFAF8", "stroke-width": 3 });
// a blue ring that grows and fades behind the point until the reader first moves it
const hint = el("circle", { id: "pulse", r: 11, fill: "none", stroke: G.MOVABLE, "stroke-width": 3 });
handle.append(hint, ring);
old.remove();
const root = fig.querySelector("g");
root.append(handle);
// Reset, right-aligned in panel 2's header
const reset = el("g", { id: "reset", tabindex: 0, role: "button", "aria-label": "Reset the blue setting" });
const [rx, ry] = G.RESET, bw = 100, bh = 44, by = ry - 10.8 - bh / 2;   // centred on the title's number disc
reset.append(el("rect", { x: rx - bw, y: by, width: bw, height: bh, rx: 8, fill: G.CARD, stroke: G.LINE, "stroke-width": 3 }));
const rt = el("text", { x: rx - bw / 2, y: by + bh / 2 + 7.5, "text-anchor": "middle", "font-family": G.FONT,
  "font-size": 22, "font-weight": 500, fill: G.GRAY });
rt.textContent = "Reset";
reset.append(rt);
root.append(reset);
const sim = $("Row Highlighted simulation");
const vRing = $("Row Highlighted verdict ring"), vGlyph = $("Row Highlighted verdict glyph");

const state = { gna: D.home[0], gk: D.home[1] };
let pending = false;
function render() {
  pending = false;
  handle.setAttribute("transform", `translate(${xP(state.gna)} ${yP(state.gk)})`);
  sim.setAttribute("d", traceD(simulate(state.gna, state.gk)));
  const good = pAt(state.gna, state.gk) >= P_OK;
  vGlyph.setAttribute("d", good ? TICK : CROSS);
  vGlyph.setAttribute("stroke", good ? G.GOOD : G.BAD);
  vRing.setAttribute("stroke", good ? G.GOOD : G.BAD);
  vRing.setAttribute("fill", good ? G.GOOD_FILL : G.BAD_FILL);
  handle.setAttribute("aria-valuetext",
    `sodium ${state.gna.toFixed(1)}, potassium ${state.gk.toFixed(1)}, ${good ? "fits" : "does not fit"}`);
}
function setPoint(gna, gk, moved = true) {
  if (moved) hint.classList.add("gone");
  state.gna = Math.max(G.XL[0], Math.min(G.XL[1], gna));
  state.gk = Math.max(G.YL[0], Math.min(G.YL[1], gk));
  if (!pending) { pending = true; requestAnimationFrame(render); }
}
function toData(ev) {
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(fig.getScreenCTM().inverse());
  return [xInv(p.x), yInv(p.y)];
}

let dragging = false;
function start(ev) {
  dragging = true; handle.classList.add("dragging");
  ev.currentTarget.setPointerCapture(ev.pointerId);
  setPoint(...toData(ev)); ev.preventDefault();
}
function move(ev) { if (dragging) setPoint(...toData(ev)); }
function end() { dragging = false; handle.classList.remove("dragging"); }
for (const e of [hit, handle]) {
  e.addEventListener("pointerdown", start);
  e.addEventListener("pointermove", move);
  e.addEventListener("pointerup", end);
  e.addEventListener("pointercancel", end);
}
handle.addEventListener("keydown", ev => {
  const big = ev.shiftKey ? 5 : 1;
  const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 0.25], ArrowDown: [0, -0.25] }[ev.key];
  if (!step) return;
  ev.preventDefault();
  setPoint(state.gna + step[0] * big, state.gk + step[1] * big);
});
reset.addEventListener("click", () => setPoint(...D.home, false));
reset.addEventListener("keydown", ev => {
  if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setPoint(...D.home, false); }
});

render();
</script>
</body>
</html>
