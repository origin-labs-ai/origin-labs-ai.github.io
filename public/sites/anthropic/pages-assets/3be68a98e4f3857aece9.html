 function move(e){var r=document.body.getBoundingClientRect();
  var x=e.clientX-r.left+14,y=e.clientY-r.top+14;
  var w=tip.offsetWidth,h=tip.offsetHeight;
  if(x+w>document.body.clientWidth-6)x=e.clientX-r.left-w-14;
  if(y+h>document.body.clientHeight-6)y=e.clientY-r.top-h-14;
  tip.style.left=x+'px';tip.style.top=y+'px';}
 function hide(){tip.style.display='none';}
 svg.addEventListener('mouseover',show);svg.addEventListener('mousemove',move);
 svg.addEventListener('mouseout',hide);
 var last=0;function ph(){try{var h=Math.max(document.body.scrollHeight,
  document.body.offsetHeight);if(Math.abs(h-last)>2){last=h;
  parent.postMessage({sg:1,h:h+2},'*');}}catch(e){}}
 addEventListener('load',ph);addEventListener('resize',ph);
 if(document.readyState!=='loading')ph();else addEventListener('DOMContentLoaded',ph);
 if(window.ResizeObserver){new ResizeObserver(ph).observe(document.body);}
 setTimeout(ph,120);setTimeout(ph,600);
})();
</script></body></html>
