  html, body { height: 100%; margin: 0; }
  body {
    background: transparent; color: #141413; overflow: hidden;
    font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;   /* the site's own face, carried in this file */
    font-feature-settings: "pnum" on, "lnum" on, "liga" on;
    -webkit-text-size-adjust: 100%;
  }
  :focus-visible { outline: 2px solid #154c92; outline-offset: 2px; }   /* the site's own focus colour */
  /* The caption, set as the site sets its own: a small label, then the words, on the page's background. */
  figcaption {
    flex: none; margin: 16px 0 auto; display: flex; align-items: baseline; column-gap: 24px; row-gap: 8px; color: #5e5d59;
  }
  figcaption .label {
    flex: none; min-width: 64px; font: 11px/1.5 "Anthropic Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .018em; text-transform: uppercase;
  }
  /* The site caps its own captions' text at 540 px. Jelena found that «much narrower than the figure» (22 Oct), so, as our answer to that,
     these run to the card's right edge. */
  figcaption .words { flex: 1 1 auto; text-wrap: pretty; font-size: 13px; line-height: 1.54; letter-spacing: .01em; }
  @media (max-width: 671px) {
    figcaption { flex-direction: column; padding: 0 var(--pad); }
    figcaption .label { min-width: 0; }
  }
  /* The zoom's buttons and slider. */
  .tools { flex: none; display: flex; align-items: center; gap: 2px; margin-right: -6px; }
  .tools button {
    display: flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; margin: 0; padding: 0;
    border: 0; border-radius: 17px; background: none; color: #30302e; cursor: pointer; font: inherit; font-size: 13px;
  }
  .tools button:hover { background: #f0eee6; }
  .tools button[aria-disabled="true"] { color: #c2c0b6; background: none; cursor: default; }
  .tools svg { width: 18px; height: 18px; }
  .tools #reset { padding: 0 10px; margin-left: 4px; }
  .tools input[type="range"] { width: 120px; margin: 0 2px; accent-color: #30302e; cursor: pointer; }
  @media (max-width: 620px) { .tools input[type="range"] { display: none; } }
  /* The stage keeps one size; the figure grows and moves inside it. */
  .stage { position: relative; overflow: hidden; }
  .stage:focus-visible { outline: none; }
  .stage:focus-visible::after { content: ""; position: absolute; inset: 0; border: 2px solid #154c92; border-radius: inherit; pointer-events: none; }   /* over the figure, which would hide an outline */
  .js .stage { cursor: zoom-in; }
  .js .stage .pic { position: absolute; left: 0; top: 0; display: block; max-width: none; -webkit-user-drag: none; user-select: none; }
  .js .stage.most { cursor: grab; }
  .js .stage.dragging { cursor: grabbing; }
  /* High-contrast modes: keep each figure as drawn, on white; a button that can go no further greys out. */
  @media (forced-colors: active) {
    .pic { forced-color-adjust: none; background: #fff; }
    .tools button[aria-disabled="true"] { forced-color-adjust: none; color: GrayText; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .glass, .tools button { transition: background-color .15s ease-out, color .15s ease-out; }
  }
  /* Figures that open in a larger window. The block sits in the middle of whatever frame the post gives it. If the frame is short
     the figures shrink to fit and the words keep their size. */
  .fig {
    --wide: calc(80vw - 3px);
    --pad: clamp(8px, 2.4vw, 16px);
    --gap: clamp(5px, 1.4vw, 10px);
    --line: clamp(17px, 2.4vw, 22px);         /* height of the "(a) ..." lines */
    --below: 56px;                            /* height of what lies under the card */
    /* the figures' width: where the frame's height, not its width, limits them, the rows, the card round them and the caption's start follow */
    --rows: min(calc(var(--wide) - 2 * var(--pad)), max(200px, calc((100vh - 2 * var(--pad) - 2 * var(--line) - 3 * var(--gap) - var(--below)) / 0.53004)));
    /* the card's width: the block's, so that its edges stay in line with the post's other figures, unless the rows are more than 8% narrower than that */
    --card: min(var(--wide), calc((var(--rows) + 2 * var(--pad)) * 1.08));
    box-sizing: border-box; width: var(--wide); height: 100%; margin: 0 auto;
    display: flex; flex-direction: column;
  }
  figcaption { margin-left: calc((var(--wide) - var(--card)) / 2); margin-right: calc((var(--wide) - var(--card)) / 2); }
  @media (max-width: 930px) { .fig { --wide: calc(83.3vw - 3px); } }
  @media (max-width: 671px) { .fig { --wide: 100vw; --below: 82px; } }
  .card {
    box-sizing: border-box; flex: 0 1 auto; min-height: 0; margin-top: auto; padding: var(--pad); align-self: center; width: var(--card);
    border-radius: 12px; background: #fff; display: flex; flex-direction: column;
  }
  .card:last-child { margin-bottom: auto; }
  /* Rows: name, figure, name, figure. The figure rows keep the proportion of the figures' heights
     and are never taller than the figures are at the block's full width. */
  .parts {
    flex: 0 1 auto; min-height: 120px; display: grid; row-gap: var(--gap); margin: 0 auto;
    width: var(--rows);
    grid-template-rows: var(--line) minmax(0, 193.0fr) var(--line) minmax(0, 337.1fr);
    height: calc((var(--wide) - 2 * var(--pad)) * 0.53004 + 2 * var(--line) + 3 * var(--gap));
  }
  .name { margin: 0; color: #3d3d3a; font-size: clamp(12px, 1.7vw, 15px); line-height: var(--line); white-space: nowrap; }
  .name b { font-weight: 600; }
  .shot { position: relative; min-height: 0; }
  .shot .pic { display: block; width: 100%; height: 100%; object-fit: contain; }
  .glass { display: none; }

  /* What follows needs the script; without it the figures and the words stay as they are. */
  .js .shot { cursor: zoom-in; }
  .js .glass {
    position: absolute; top: 0; right: 0; display: flex; align-items: center; justify-content: center;
    width: clamp(24px, 3.4vw, 32px); height: clamp(24px, 3.4vw, 32px); margin: 0; padding: 0; border-radius: 50%;
    background: #fff; border: 1px solid #87867f; color: #3d3d3a; cursor: inherit;
  }
  .glass svg { width: 56%; height: 56%; }
  .js .shot:hover .glass, .js .glass:focus-visible { background: #f0eee6; border-color: #141413; color: #141413; }

  /* The larger window: a panel over the block, with a margin round it. */
  dialog {
    --edge: 8px;   /* margin between the panel and the frame; the script sets it for the frame's width */
    box-sizing: border-box; width: min(calc(100% - 2 * var(--edge)), 1800px); max-width: none; max-height: none;
    margin: auto; padding: 0 12px 12px; border: 1px solid #e8e6dc; border-radius: 12px; background: #fff; color: inherit;
    overflow: hidden; box-shadow: 0 2px 6px rgba(20, 20, 19, .10), 0 6px 18px rgba(20, 20, 19, .16);   /* soft and short, to end inside the frame */
  }
  dialog:not([open]) { display: none; }   /* also for a browser that does not know <dialog> */
  dialog:focus { outline: none; }
  dialog::backdrop { background: transparent; }   /* no veil over the frame: it could not reach past the frame, and its edge showed on the page */
  .open .fig { opacity: .14; }                    /* the block itself fades instead, while the window is open */
  @media (prefers-reduced-motion: no-preference) { .fig { transition: opacity .15s ease-out; } }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .bar .name { overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .tools #reset { margin-right: 6px; }
  .stage { width: 100%; touch-action: none; border-radius: 6px; }
  @media (max-width: 480px) {
    .bar .name { white-space: normal; font-size: 13px; line-height: 1.25; }
    .tools button { min-width: 30px; height: 30px; }
  }
</style>

      <button type="button" id="in" aria-label="Zoom in" title="Zoom in"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10h12M10 4v12"/></svg></button>
      <button type="button" id="reset">Reset</button>
      <button type="button" id="close" aria-label="Close" title="Close"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"/></svg></button>
    </div>
  </div>
  <div class="stage" id="stage" tabindex="0" role="group" aria-labelledby="title"></div>
</dialog>

<script>
/* A click or tap on a figure, or Enter on its magnifier button, opens it in a larger window over the block.
   Escape, the cross, or a click outside the window closes it.
   The window opens on the whole figure and keeps one size. Inside it the figure zooms smoothly, from the whole figure up to
   the size at which its small print is comfortable: the wheel, a pinch (trackpad or touch), the slider, + and - (one gentle
   step each), or a click on the figure (one step, towards the point clicked). Dragging or the arrow keys move it; Reset or 0 goes back.
   The window shows a copy of the figure made on the spot, so the figure is in the file only once.
   No network, storage or URL access. */
(function () {
  'use strict';
  /* The zoom, shared by every figure of the post. stage: the box the figure is shown in. tools: its buttons and slider.
     modal: true in the larger window, where the wheel zooms and one finger moves the figure at once; false for a figure that
     zooms in its place in the post, where the wheel and one finger must go on scrolling the post. */
  function zoomer(stage, tools, modal) {
    var STEP = 1.25;         // one press of + or -, one click, one notch of a mouse wheel
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pic = null;          // the figure on the stage
    var ratio = 1;           // its width / height
    var width = 0;           // its shown width, CSS px
    var left = 0, top = 0;   // where its top left corner is, measured from the stage's
    var whole = 0;           // the width at which the whole figure fits the stage
    var largest = 0;         // the greatest width: see most() below
    var seenW = 0, seenH = 0;   // the stage's size when the figure was last drawn
    var sliding = false;

    var hold = [0.5, 0.5];   // which point of the stage stays put when a button, the slider or a key zooms: [0, 1] is its bottom left corner
    function middle() { return { x: stage.clientWidth * hold[0], y: stage.clientHeight * hold[1] }; }
    function at(event) {     // where an event is, measured from the stage's corner
      var box = stage.getBoundingClientRect();
      return { x: event.clientX - box.left, y: event.clientY - box.top };
    }
    function near() { return width > whole + 0.5; }

    // Show the figure w px wide, keeping the point of it that is at p of the stage where it is.
    function show(w, p) {
      var u = (p.x - left) / width, v = (p.y - top) / (width / ratio);
      width = Math.max(whole, Math.min(largest, w));
      left = p.x - u * width;
      top = p.y - v * width / ratio;
      draw();
    }
    // The figure never leaves the stage: centred where it is the smaller of the two, else edge to edge at most.
    function draw() {
      var w = seenW = stage.clientWidth, h = seenH = stage.clientHeight, tall = width / ratio;
      left = width <= w ? (w - width) / 2 : Math.min(0, Math.max(w - width, left));
      top = tall <= h ? (h - tall) / 2 : Math.min(0, Math.max(h - tall, top));
      pic.style.width = width + 'px';
      pic.style.height = tall + 'px';
      pic.style.transform = 'translate(' + left + 'px,' + top + 'px)';
      // aria-disabled, not disabled: a disabled button would drop the keyboard focus
      tools.out.setAttribute('aria-disabled', !near());
      tools.reset.setAttribute('aria-disabled', !near());
      tools.in.setAttribute('aria-disabled', width >= largest - 0.5);
      stage.classList.toggle('near', near());
      stage.classList.toggle('most', width >= largest - 0.5);
      if (!sliding) tools.slide.value = Math.round(100 * Math.log(width / whole) / Math.log(largest / whole));
    }

    // Glide to w px wide about p of the stage; a new call while gliding only moves the goal.
    var goal = 0, about = null, frame = 0, last = 0;
    function glide(w, p) {
      if (!pic) return;
      goal = Math.max(whole, Math.min(largest, w)); about = p;
      if (calm) return show(goal, p);
      if (!frame) { last = performance.now(); frame = requestAnimationFrame(tick); }
    }
    function tick(now) {
      frame = 0;
      if (!pic) return;
      var part = 1 - Math.exp(-Math.max(0, now - last) / 55);   // a frame's time stamp can be earlier than the call that asked for the frame
      last = now;
      var w = width * Math.pow(goal / width, part);
      if (Math.abs(goal - w) < 0.5) w = goal;
      show(w, about);
      if (w !== goal) frame = requestAnimationFrame(tick);
    }
    function halt() { if (frame) cancelAnimationFrame(frame); frame = 0; goal = width; }
    function step(up, p) {   // one step in or out, about p or else the stage's fixed point
      var w = (frame ? goal : width) * (up ? STEP : 1 / STEP);
      if (up && w * 1.1 > largest) w = largest;                     // no last step too small to notice
      if (!up && w < whole * 1.1) w = whole;
      glide(w, p || middle());
    }
    function home() { glide(whole, middle()); }

    tools.in.addEventListener('click', function () { step(true); });
    tools.out.addEventListener('click', function () { step(false); });
    tools.reset.addEventListener('click', home);
    tools.slide.addEventListener('input', function () {
      sliding = true; halt();
      show(whole * Math.pow(largest / whole, tools.slide.value / 100), middle());
      sliding = false;
    });

    // Keys: + and - zoom, 0 shows the whole figure, arrows move a zoomed figure. True if the key was used.
    function key(event) {
      if (!pic || event.ctrlKey || event.metaKey || event.altKey) return false;   // leave the browser's own shortcuts alone
      var move = { ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80] }[event.key];
      if (move && (document.activeElement === tools.slide || !(modal || near()))) return false;   // the slider's, or the post's, own keys
      if (move) { halt(); left += move[0]; top += move[1]; draw(); }
      else if (event.key === '+' || event.key === '=') step(true);
      else if (event.key === '-' || event.key === '_') step(false);
      else if (event.key === '0') home();
      else return false;
      event.preventDefault();
      return true;
    }

    // The wheel, or two fingers on a trackpad, zooms towards the pointer: a mouse's notch is about one step, a trackpad's
    // small movements are small changes. A pinch on a trackpad arrives as a wheel with Ctrl and smaller numbers.
    stage.addEventListener('wheel', function (event) {
      if (!pic || !(modal || event.ctrlKey)) return;
      event.preventDefault();
      var d = event.deltaY * (event.deltaMode === 1 ? 33 : event.deltaMode === 2 ? 300 : 1) * (event.ctrlKey ? 0.01 : 0.002);
      d = Math.max(-Math.log(STEP), Math.min(Math.log(STEP), d));   // no single event more than one step: Ctrl + a mouse's notch has a pinch's flag and a wheel's size
      glide((frame ? goal : width) * Math.exp(-d), at(event));
    }, { passive: false });
    // Safari reports a trackpad pinch in its own way.
    var pinched = 0;
    stage.addEventListener('gesturestart', function (event) { event.preventDefault(); halt(); pinched = width; });
    stage.addEventListener('gesturechange', function (event) {
      event.preventDefault();
      if (pic && pinched && !count) show(pinched * event.scale, at(event));
    });

    // One pointer down: drag to move. Two: pinch to zoom about the point between them. A press that does not move is a click.
    var down = {}, count = 0, moved = false, mid = null, finger = false;
    function two() {
      var k = Object.keys(down), a = down[k[0]], b = down[k[1]];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) };
    }
    stage.addEventListener('pointerdown', function (event) {
      if (!pic || count === 2 || (event.pointerType === 'mouse' && event.button !== 0)) return;
      halt();
      if (!down[event.pointerId]) count++;   // a pointer whose lifting was never reported comes down again
      down[event.pointerId] = at(event);
      finger = event.pointerType === 'touch';
      if (count === 1) moved = false;
      if (count === 2) { moved = true; mid = two(); }
      try { stage.setPointerCapture(event.pointerId); } catch (gone) {}   // the pointer may have lifted already
    });
    stage.addEventListener('pointermove', function (event) {
      var was = down[event.pointerId];
      if (!was || !pic) return;
      var now = at(event);
      if (count === 1) {
        if (!moved && Math.abs(now.x - was.x) + Math.abs(now.y - was.y) <= 4) return;   // still a click
        moved = true;
        if (near()) stage.classList.add('dragging');
        left += now.x - was.x; top += now.y - was.y;
        down[event.pointerId] = now;
        draw();
      } else {
        down[event.pointerId] = now;
        var next = two();
        left += next.x - mid.x; top += next.y - mid.y;
        show(width * next.d / mid.d, next);
        mid = next;
      }
    });
    function lift(event) {
      if (!down[event.pointerId]) return;
      delete down[event.pointerId]; count--;
      if (count) return;
      stage.classList.remove('dragging');
      // In the post, two fingers that meant to scroll can leave a trace of zoom, and a zoomed figure no longer scrolls the post: undo it.
      if (!modal && finger && pic && near() && width < whole * 1.1) home();
    }
    stage.addEventListener('pointerup', lift);
    stage.addEventListener('pointercancel', lift);
    stage.addEventListener('lostpointercapture', lift);
    stage.addEventListener('click', function (event) {
      if (!pic) return;
      var p = at(event);
      var onFigure = p.x >= left && p.x <= left + width && p.y >= top && p.y <= top + width / ratio;
      // In the post a finger's tap does not zoom: it is too easily a slip while scrolling, and a zoomed figure no longer scrolls the post.
      if (onFigure && !moved && (modal || !finger) && !(api.skip && api.skip(event))) step(true, p);
      moved = false;
    });

    var api = {
      skip: null,            // may be set to a test for clicks that must not zoom
      key: key,
      // Put a figure (w / h = its proportions) on the stage; none takes it off. fixed: see hold above; for a plot the corner where its axes meet,
      // so that the buttons do not push the axes out of view.
      load: function (figure, proportions, fixed) { halt(); pic = figure; ratio = proportions || 1; hold = fixed || [0.5, 0.5]; width = 0; down = {}; count = 0; stage.classList.remove('dragging'); },
      // How wide the figure may get, CSS px. comfort: where its small print is comfortable. dots: a raster's own pixel width (0 for a drawing):
      // it is not stretched past one and a half screen pixels for each of its own, where it starts to look soft.
      // fits: the whole figure's width; there is always half as much again to zoom into.
      most: function (comfort, dots, fits) {
        return Math.max(dots ? Math.min(comfort, 1.5 * dots / (window.devicePixelRatio || 1)) : comfort, 1.5 * fits);
      },
      // Fit to the stage's present size. most: the greatest width, from most() above.
      // The first time the whole figure is shown; after that the zoom keeps its place on the slider.
      fit: function (most) {
        if (!pic || !stage.clientWidth || !stage.clientHeight) return;   // a hidden frame has no size yet; a resize follows when it is shown
        halt();
        var share = width ? Math.log(width / whole) / Math.log(largest / whole) : 0;
        whole = Math.min(stage.clientWidth, stage.clientHeight * ratio);
        largest = Math.max(most, whole * 1.5);
        var centre = width ? { u: (seenW / 2 - left) / width, v: (seenH / 2 - top) / (width / ratio) } : { u: 0.5, v: 0.5 };   // what was in the middle stays there
        width = whole * Math.pow(largest / whole, share);
        left = stage.clientWidth / 2 - centre.u * width;
        top = stage.clientHeight / 2 - centre.v * width / ratio;
        draw();
      }
    };
    return api;
  }
  var id = function (name) { return document.getElementById(name); };
  var viewer = id('viewer'), stage = id('stage'), title = id('title');
  if (typeof viewer.showModal !== 'function') return;   // very old browser: leave the plain figures
  document.documentElement.className = 'js';
  var zoom = zoomer(stage, { in: id('in'), out: id('out'), reset: id('reset'), slide: id('slide') }, true);

  // The room that the caption takes under the card: measured, because its length and its lines vary. Twice, since the figures' width
  // follows from it and the caption's start from that.
  var block = document.querySelector('.fig'), words = document.querySelector('figcaption');
  // The block is as wide as the post's other figures, which depends on the screen's width, not the frame's. A frame from 930 to 1183 px wide can be
  // part of a screen of 1280 px or more, which the style sheet takes it for, or all twelve columns of a narrower one, 96 px wider than the frame.
  // Where the browser window's own width says that it is the second, the block follows.
  function span() {
    var frame = window.innerWidth, twelve = frame > 930 && frame <= 1183 && Math.abs(window.outerWidth - (frame + 96)) <= 40;
    if (twelve) block.style.setProperty('--wide', 'calc(83.3vw - 3px)'); else block.style.removeProperty('--wide');
  }
  function below() {
    for (var turn = 0; words && turn < 2; turn++) block.style.setProperty('--below', words.offsetHeight + 16 + 'px');
  }
  span();
  below();

  var HEADER = 84;         // height of the site's header bar, which stays at the top of the screen, over the post
  var opener = null;       // the open figure's place in the block
  var pic = null;          // the copy of it in the window
  var ratio = 1;           // its width / height
  var seen = null;         // the part of the frame that is on the reader's screen
  var fresh = false;       // no click has reached the open window yet

  // The frame can be taller than the reader's screen. Ask the browser which part of it is in view, then go on.
  function look(then) {
    if (!('IntersectionObserver' in window)) return then();
    var watcher = new IntersectionObserver(function (entries) {
      watcher.disconnect();
      var part = entries[0].intersectionRect;
      seen = part.height > 0 ? { top: part.top, bottom: part.bottom } : null;
      then();
    });
    watcher.observe(document.documentElement);
  }

  // Sizes the window for the present frame and centres it in the part of the frame that is in view.
  function place() {
    // The site's header lies over the top of the screen and the browser does not count it. A frame that begins less than the
    // header's height below the top of the screen looks wholly in view from in here, so the window always keeps clear by that much.
    var to = seen ? Math.min(window.innerHeight, seen.bottom) : window.innerHeight;
    var edge = Math.max(8, Math.min(64, window.innerWidth * 0.05 - 30));
    var from = Math.min((seen ? Math.max(0, seen.top) : 0) + HEADER + 8 - edge, Math.max(0, to - 220));   // unless too little of the frame is in view for that
    viewer.style.setProperty('--edge', edge + 'px');
    var own = viewer.offsetHeight - stage.offsetHeight;            // the window's bar, padding and border
    var room = Math.max(120, to - from - 2 * edge - own);          // the tallest the figure's part can be
    var most = zoom.most(Number(opener.getAttribute('data-max')), Number(opener.getAttribute('data-dots')), Math.min(stage.clientWidth, room * ratio));
    var tall = Math.min(room, most / ratio);                       // a low, wide figure gets a lower window
    stage.style.height = tall + 'px';
    var y = from + edge + (room - tall) / 2;
    viewer.style.marginTop = Math.max(edge, Math.min(y, window.innerHeight - edge - own - tall)) + 'px';   // not past the frame's own ends
    zoom.fit(most);
  }

  function open(shot) {
    opener = shot;
    pic = shot.querySelector('.pic').cloneNode(true);
    ratio = Number(shot.getAttribute('data-w')) / Number(shot.getAttribute('data-h'));
    title.textContent = '';
    Array.prototype.forEach.call(id(shot.getAttribute('data-name')).childNodes, function (node) {
      title.appendChild(node.cloneNode(true));
    });
    stage.appendChild(pic);
    zoom.load(pic, ratio, shot.getAttribute('data-hold').split(',').map(Number));
    fresh = true;
    stage.style.height = '0';
    viewer.style.marginTop = (seen ? Math.max(0, seen.top) : 0) + HEADER + 'px';   // open where the reader is looking, or the browser would scroll the post to the window
    viewer.showModal();
    document.documentElement.classList.add('open');
    viewer.focus();   // the window itself takes the focus, so that no button shows a focus ring before Tab is pressed
    place();
  }
  function shut() {
    document.documentElement.classList.remove('open');
    if (!pic) return;
    zoom.load(null);
    stage.removeChild(pic);
    pic = null;
    opener.querySelector('.glass').focus({ preventScroll: true });   // or the browser would scroll the post to the button
  }

  Array.prototype.forEach.call(document.querySelectorAll('.shot'), function (shot) {
    shot.addEventListener('click', function () {   // the button's own clicks arrive here too
      look(function () { if (!viewer.open) open(shot); });
    });
  });
  id('close').addEventListener('click', function () { viewer.close(); });
  viewer.addEventListener('close', shut);

  // The second half of the double-click that opened the window does not zoom.
  zoom.skip = function (event) { return fresh && event.detail > 1; };
  stage.addEventListener('click', function () { fresh = false; });

  // A click beside the window closes: one that began there (not the end of a drag from inside the window)
  // and is not the second half of the double-click that opened the window.
  var pressedOutside = false;
  function outside(event) {
    var box = viewer.getBoundingClientRect();
    return event.target === viewer && (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom);
  }
  viewer.addEventListener('pointerdown', function (event) { pressedOutside = outside(event); });
  viewer.addEventListener('click', function (event) {
    if (pressedOutside && outside(event) && event.detail < 2) viewer.close();
  });

  // Tab goes round inside the window: past its last stop the focus would leave the frame. Escape is the dialog's own.
  viewer.addEventListener('keydown', function (event) {
    var on = document.activeElement;
    if (event.key !== 'Tab') return void zoom.key(event);
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (!event.shiftKey && on === stage) id('out').focus();
    else if (event.shiftKey && (on === id('out') || on === viewer)) stage.focus();
    else return;
    event.preventDefault();
  });

  // A new frame size: fit the open window to it at once, and again when the browser has said what is now in view.
  function refit() { if (viewer.open) place(); }
  window.addEventListener('resize', function () { span(); below(); refit(); look(refit); });
})();
</script>
</body>
