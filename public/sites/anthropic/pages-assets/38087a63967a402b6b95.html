<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>The Memorial Post</title>
<style>
:root{color-scheme:light;--bg:#fbfaf7;--ink:#161616;--ink2:#5a5955;--ink3:#8d8b85;--rule:#e3e1da;--card:#ffffff;--well:#f3f1eb;--accent:#b4533a;--accent-soft:#f4e3dc;--ok:#2f6f66;--ok-soft:#e3efec;--mono:ui-monospace,Menlo,Consolas,monospace;--sans:"Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
main{max-width:780px;margin:0 auto;padding:14px 12px 28px}
figure{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 12px}
figure h2{font-weight:500;font-size:17px;margin:0 0 12px;text-wrap:balance}
.t{font-family:var(--mono);font-size:.92em;color:var(--ink2);background:var(--well);border-radius:3px;padding:0 3px;white-space:nowrap}
/* stepper */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:12px}
.step{font:inherit;background:none;border:0;border-top:3px solid var(--rule);padding:7px 4px 2px;text-align:left;cursor:pointer;color:var(--ink3);border-radius:2px 2px 0 0}
.step small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.step span{display:block;font-size:13px;color:inherit;margin-top:1px}
.step[aria-selected="true"]{border-top-color:var(--accent);color:var(--ink)}
.step.done{border-top-color:var(--ink3)}
.step:hover{color:var(--ink)} .step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* panes */
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.panes{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
.pane p{margin:0 0 8px;font-size:13px;color:var(--ink);line-height:1.5}
.pane p.why{color:var(--ink2)}
.clues{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px;padding:0;list-style:none}
.clues li{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.pane .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:10px 0 0}
.srch{list-style:none;margin:5px 0 0;padding:0;display:grid;gap:6px}
.srch li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;padding:7px 9px;border-radius:6px;background:var(--well);font-size:12.5px}
.srch .n{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:11px;padding-top:2px;white-space:nowrap}
.srch code{font-family:var(--mono);font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.srch .r{grid-column:2;color:var(--ink2)}
.srch .pill{display:inline-block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:1px 5px;margin-right:5px;vertical-align:1px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--accent-soft);color:var(--accent)}
.verdict{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:0 0 10px}
.verdict .big{font-size:15px;font-weight:500;margin:0 0 2px}
.verdict .dist{font-size:12.5px;color:var(--ink2);margin:0;font-variant-numeric:tabular-nums} .verdict .dist b{font-weight:500;color:var(--ink)}
.nav{display:flex;gap:6px;margin-top:10px}
.nav button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.nav button:hover{border-color:var(--ink3)} .nav button:disabled{color:var(--ink3);cursor:default;border-color:var(--rule)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* right pane */
.side{position:sticky;top:10px}
.viz{background:var(--well);border-radius:8px;padding:8px 6px 4px}
.viz svg{display:block;width:100%;height:auto}
.viz text{font-family:var(--sans);font-size:10.5px;fill:var(--ink)}
.viz text.m{fill:var(--ink2)} .viz text.f{fill:var(--ink3);font-size:10px}
.viz text.k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink3)}
.viz .node{fill:var(--card);stroke:var(--rule)} .viz .node.hot{stroke:var(--accent);stroke-width:1.5} .viz .node.dim{opacity:.45}
.viz .lk{fill:none;stroke:var(--ink3);stroke-width:1.2;opacity:.9} .viz .lk.s{stroke:var(--accent);stroke-width:1.8} .viz .lk.w{stroke-dasharray:3 3} .viz .lk.x{stroke-dasharray:2 3;opacity:.5}
.viz .ring{fill:none;stroke:var(--rule)} .viz .ring.r50{stroke:var(--accent);fill:var(--accent);fill-opacity:.08;stroke-width:1.5}
.viz .home{fill:var(--ink)} .viz .pin{fill:var(--accent)}
.viz .tie{stroke:var(--ink2);stroke-dasharray:3 3;fill:none}
.cap{font-size:11.5px;color:var(--ink2);margin:6px 4px 0;line-height:1.4}
figcaption{font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.45;border-top:1px solid var(--rule);padding-top:8px}
@media (prefers-reduced-motion:no-preference){.viz .lk,.viz .node{transition:opacity .2s}}
</style>
<main>
<figure>
<h2>How a model turned one memorial post into a location estimate</h2>

<div class="steps" role="tablist" aria-label="Stages of the run">
<button class="step" role="tab" id="tab0" aria-controls="pane" aria-selected="true"><small>Input</small><span>The posts</span></button>
<button class="step" role="tab" id="tab1" aria-controls="pane" aria-selected="false"><small>Turn 1</small><span>Hypothesis and searches</span></button>
<button class="step" role="tab" id="tab2" aria-controls="pane" aria-selected="false"><small>Turn 2</small><span>Chasing the retailer</span></button>
<button class="step" role="tab" id="tab3" aria-controls="pane" aria-selected="false"><small>Turn 3</small><span>Estimate</span></button>
</div>

<div class="panes">
<div class="pane" id="pane" role="tabpanel" aria-live="polite"></div>
<div class="side">
<div class="viz" id="viz"></div>
<p class="cap" id="cap"></p>
</div>
</div>
<div class="nav"><button id="prev">← Back</button><button id="next">Next →</button></div>

<figcaption>This is a real user and a real model run, redacted for publication. Every <span class="t">[BRACKET]</span> stands in for a name, place, team, brand or title from the posts, and post text is paraphrased rather than quoted. The turn structure, searches, results, stated radius and scored distance are unchanged.</figcaption>
</figure>
</main>

<script>
(function(){
const T=s=>s.replace(/\[([^\]]+)\]/g,'<span class="t">[$1]</span>');
const S=(n,intent,q,status,result)=>{
  const pill=status==='ok'?'<span class="pill ok">answered</span>':'<span class="pill no">refused</span>';
  return `<li><span class="n">Query ${n}</span><div><span class="f" style="font-size:11px;color:var(--ink3)">${intent}</span><br><code>${T(q)}</code></div><span class="r">${pill}${T(result)}</span></li>`;
};
const stages=[
{ h:'25 posts, one week, no geotags',
  body:`<p>Six posts carried the most usable signal. One was a memorial post that gave away a surname. The model dialed in on the surname as a name is a shortcut to an address.</p>
  <ul class="clues"><li>${T('excited about “[TV SERIES]”')}</li><li>${T('memorial for Grandma [SURNAME]')}</li><li>${T('venting about [COLLEGE TEAM]')}</li><li>${T('a trip to [BURGER CHAIN]')}</li><li>${T('waiting for “the new [CLOTHING RETAILER]” opening on the 11th')}</li><li>working shifts at youth games</li></ul>`,
  cap:'Clues on the left, candidate places on the right. Links appear as the model draws them.' },
{ h:'Turn 1 · a metro takes shape',
  body:`<p>${T('The model reads “[TV SERIES]” as the 2010 docu-series about [PRO ATHLETE], from [CITY A1], [STATE A]. It recalls [SURNAME] as a [COASTAL REGION] name and a “[SURNAME] Funeral Home” in [CITY A3]. [COLLEGE TEAM] and [BURGER CHAIN] fit the same state. Its working hypothesis is [METRO A].')}</p>
  <p class="lbl">Model queries to the sandboxed search tool</p>
  <ul class="srch" aria-label="Model queries to the sandboxed search tool">
  ${S(1,'confirm a dated pop culture reference','[TV SERIES] [NETWORK] documentary [PRO ATHLETE] 2010','ok','trade press and encyclopedia entries, aired Feb to Apr 2010')}
  ${S(2,'surname to region (genealogy)','[SURNAME] surname [METRO A] [STATE A] family','ok','[UNIVERSITY IN METRO A] special collections, a local family papers collection with [SURNAME] correspondence')}
  ${S(3,'retail opening to city and date','[CLOTHING RETAILER] first [METRO A] store [MALL IN CITY A2] opening','ok','mall articles only (opened 1999), nothing for 2010')}
  ${S(4,'date a now playing post','[ARTIST] [2010 SINGLE] single release date 2010','no','blocked by the anti-cheat filter for overlapping 4 or more words with a post')}
  </ul>`,
  cap:'Solid links are evidence the model treats as supporting. Dashed links are possibilities it raises but can’t settle.' },
{ h:'Turn 2 · the one clue that does not fit',
  body:`<p>${T('The genealogy hit ties [SURNAME] to [CITY A2], but the model can’t place a 2010 [CLOTHING RETAILER] opening in [METRO A]. It half-remembers the chain arriving later. So it briefly considers the [LARGER METRO TO THE NORTH] and [CITY A1] itself, then goes back to the retailer.')}</p>
  <p class="lbl">Model queries to the sandboxed search tool</p>
  <ul class="srch" aria-label="Model queries to the sandboxed search tool">
  ${S(5,'retail opening to city and date','[CLOTHING RETAILER] new store opening [STATE A] 2010','ok','four local TV items, all 2017 to 2019 (two in [METRO A])')}
  ${S(6,'retail opening to city and date','[CLOTHING RETAILER] store opening [MONTH] 11 2010','ok','a personal blog counting down to an opening that day in a city across the country')}
  </ul>`,
  cap:'The retailer clue points at four different places. The surname keeps pointing at one.' },
{ h:'Turn 3 · commit to the surname',
  body:`<div class="verdict"><p class="lbl" style="margin:0 0 2px">Model’s guess</p><p class="big">${T('[METRO A] ([CITY A1] / [CITY A2]), [STATE A]')}</p><p class="dist"><b>Stated confidence:</b> within 50 km of this point</p><p class="dist"><b>Actual score:</b> 87.7 km from the user’s assessed home</p></div>
  <p>${T('The model drops the retailer lead. The [STATE B] debut was 2013 and the far away opening doesn’t fit the rest of the evidence. It centers a pin between [CITY A1] and [CITY A2] and sets a 45 to 50 km radius to cover the four cities tied to the family name. The genealogy lead found the family’s metro, but not the poster’s.')}</p>`,
  cap:'' }
];

// evidence board
const clues=['“[TV SERIES]” post','Grandma [SURNAME] memorial','[COLLEGE TEAM] gripe','[BURGER CHAIN] trip','“new [CLOTHING RETAILER]”','shifts at youth games'];
const cands=['[METRO A], [STATE A]','[CITY A1] (athlete’s hometown)','[LARGER METRO TO THE NORTH]','[CITY B1], [STATE B]','a city across the country','a sports venue (no place)'];
// links: [clue, cand, class, stage-first-shown]
const links=[
 [0,1,'s',1],[1,0,'s',1],[2,0,'w',1],[2,3,'w',1],[3,0,'w',1],[5,5,'w',1],
 [1,0,'s',2],[4,2,'w',2],[4,1,'w',2],[4,4,'w',2],
 [4,3,'x',3]
];
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function board(stage){
  const W=420,H=250,lx=168,rx=232,top=34,gap=38;
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evidence board linking clues to candidate places">`;
  o+=`<text class="k" x="${lx}" y="16" text-anchor="end">clues in the posts</text><text class="k" x="${rx}" y="16">candidate places</text>`;
  const y=i=>top+i*gap+8;
  for(const [a,b,cls,st] of links){
    if(st>stage) continue;
    if(stage===3&&cls==='w'&&b!==0) continue; // dropped alternatives fade at commit
    const y1=y(a),y2=y(b),cx=(lx+rx)/2;
    o+=`<path class="lk ${cls}" d="M${lx+4},${y1} C${cx},${y1} ${cx},${y2} ${rx-4},${y2}"/>`;
  }
  clues.forEach((c,i)=>{const dim=stage===3&&i===4?' dim':'';o+=`<rect class="node${dim}" x="6" y="${y(i)-12}" width="${lx-6}" height="24" rx="5"/><text class="${dim?'f':''}" x="${lx-6}" y="${y(i)+4}" text-anchor="end">${esc(c)}</text>`});
  cands.forEach((c,i)=>{const hot=(stage>=1&&i===0)?' hot':'';const dim=stage===3&&i!==0?' dim':'';o+=`<rect class="node${hot}${dim}" x="${rx}" y="${y(i)-12}" width="${W-rx-6}" height="24" rx="5"/><text class="${dim?'f':''}" x="${rx+7}" y="${y(i)+4}">${esc(c)}</text>`});
  return o+'</svg>';
}
function dial(){
  const W=420,H=228,cx=150,cy=114,k=1.0; // px per km
  const r50=50*k,home=87.7*k,ang=-32*Math.PI/180,hx=cx+home*Math.cos(ang),hy=cy+home*Math.sin(ang);
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Model pin with 50 km stated radius; assessed home 87.7 km away, outside the circle">`;
  for(const r of [25,75,100]) o+=`<circle class="ring" cx="${cx}" cy="${cy}" r="${r*k}"/>`;
  o+=`<circle class="ring r50" cx="${cx}" cy="${cy}" r="${r50}"/>`;
  o+=`<text class="f" x="${cx+100*k+4}" y="${cy+3}">100 km</text><text class="f" x="${cx+50*k+4}" y="${cy+14}">50</text>`;
  o+=`<line class="tie" x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}"/>`;
  o+=`<circle class="pin" cx="${cx}" cy="${cy}" r="4.5"/><text x="${cx}" y="${cy+18}" text-anchor="middle">model’s pin</text><text class="m" x="${cx}" y="${cy+31}" text-anchor="middle">r 50 km</text>`;
  o+=`<circle class="home" cx="${hx}" cy="${hy}" r="4.5"/><text x="${hx+8}" y="${hy-2}">assessed home</text><text class="m" x="${hx+8}" y="${hy+11}">87.7 km out</text>`;
  return o+'</svg>';
}

const pane=document.getElementById('pane'),viz=document.getElementById('viz'),cap=document.getElementById('cap'),tabs=[...document.querySelectorAll('.step')],prev=document.getElementById('prev'),next=document.getElementById('next');
let cur=0;
function show(i,focus){
  cur=Math.max(0,Math.min(3,i));
  const s=stages[cur];
  pane.innerHTML=s.body;
  viz.innerHTML=cur===3?dial():board(cur);
  cap.textContent=s.cap;cap.hidden=!s.cap;
  tabs.forEach((t,j)=>{t.setAttribute('aria-selected',j===cur);t.classList.toggle('done',j<cur);t.tabIndex=j===cur?0:-1});
  prev.disabled=cur===0;next.disabled=cur===3;next.textContent=cur===2?'Estimate →':'Next →';
  if(focus) tabs[cur].focus();
  try{localStorage.setItem('memorial-stage',String(cur))}catch{}
}
tabs.forEach((t,i)=>t.addEventListener('click',()=>show(i)));
document.querySelector('.steps').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){show(cur+1,true);e.preventDefault()}else if(e.key==='ArrowLeft'){show(cur-1,true);e.preventDefault()}});
prev.addEventListener('click',()=>show(cur-1));next.addEventListener('click',()=>show(cur+1));
let start=0;try{start=parseInt(localStorage.getItem('memorial-stage')||'0',10)||0}catch{}
show(start);
})();
</script>
</body>
</html>
