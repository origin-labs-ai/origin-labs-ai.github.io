<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>
:root{--bg:#ffffff;--fg:#2a2823;--mut:#6d6658;--ok:#1a7f37;--warn:#b5852c;--crit:#cf222e;--acc:#0969da;--card:#f6f4ee;--bd:#e6e1d6}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:2vw 2.5vw;overflow:hidden}
h1{font-size:21px;margin:0 0 2px}
h2{font-size:15px;margin:30px 0 10px;color:var(--acc);border-bottom:1px solid var(--bd);padding-bottom:5px}
.sub{color:var(--mut);margin:0 0 4px}
code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:12.5px}
.eq{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;margin:12px 0;font:13.5px/2 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto}
.eq b{color:var(--ok)} .eq .d{color:var(--acc)} .eq .m{color:var(--mut);font-size:12px}
.note{color:var(--mut);font-size:12.5px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.charts{grid-template-columns:1fr}}
.chart-title{font-size:2.5vw;font-weight:600;margin-bottom:1vw}
.chart{position:relative;background:var(--card);box-shadow:inset 0 0 0 1px var(--bd);border-radius:1.6vw;padding:1.6vw 1.2vw 1vw}
.chartsvg{width:100%;height:auto;display:block}
.cgrid{stroke:var(--bd);opacity:.45}
.cax{fill:var(--mut);font-size:9px}.cay{text-anchor:end}.cx{text-anchor:middle}
.caxl{fill:var(--mut);font-size:10px;text-anchor:middle}
.cpt{cursor:pointer;transition:r .1s}
.clegend{display:flex;gap:3vw;justify-content:center;font-size:2.2vw;color:var(--mut);margin-top:.4vw}
.clegend i{display:inline-block;width:.9em;height:.9em;border-radius:.18em;margin-right:.45em;vertical-align:-.08em}
.ctip{position:absolute;display:none;background:#000e;color:#fff;padding:3px 7px;border-radius:5px;font-size:11px;pointer-events:none;white-space:nowrap;z-index:6}
table{border-collapse:collapse;margin:10px 0;font-size:13px}
th,td{border:1px solid var(--bd);padding:6px 12px;text-align:right}
th{background:var(--card);color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:left}
</style></head><body>
<div class=chart-title>Estimated decode throughput vs context</div>
<div id=chart2 class=chart></div>
<script>
const CX=[256,512,1024,2048,4096,8192,16384,32768], CLAB=['256','512','1k','2k','4k','8k','16k','32k'];
const PRE=[8.0,7.2,6.0,4.45,2.95,1.76,0.97,0.51];
const DEC=[0.34,0.31,0.28,0.22,0.155,0.116,0.063,0.033];
const MEM={x:[0,16384,32768,49152,65536,81920,98304,114688,131072],w:0.942,kvb:8192,act:0.25,ram:1.7};
const S2={x:[0,25,50,75,100,150], p:[1.84,1.75,1.66,1.57,1.50,1.37], d:[0.35,0.34,0.29,0.26,0.23,0.20]};
function ctips(el){const tip=document.createElement('div');tip.className='ctip';el.appendChild(tip);
 el.querySelectorAll('.cpt').forEach(c=>{
  c.onmouseenter=()=>{tip.textContent=c.getAttribute('data-l');tip.style.display='block';
   const r=el.getBoundingClientRect(),b=c.getBoundingClientRect();
   tip.style.left=(b.left-r.left+10)+'px';tip.style.top=(b.top-r.top-6)+'px';c.setAttribute('r','5.5');};
  c.onmouseleave=()=>{tip.style.display='none';c.setAttribute('r','3.5');};});}
function ticks(m){const r=m/5.2,g=Math.pow(10,Math.floor(Math.log10(r))),st=[1,2,2.5,5,10].map(k=>k*g).find(v=>v>=r),o=[];for(let v=0;v<=m+1e-9;v+=st)o.push(+v.toFixed(6));return o;}
function svgChart(el,o){
 const W=460,H=199,mL=42,mR=10,mT=10,mB=42,pw=W-mL-mR,ph=H-mT-mB,lg=Math.log;
 const xs=[].concat(...o.series.map(s=>s.pts.map(p=>p[0]))),ys=[].concat(...o.series.map(s=>s.pts.map(p=>p[1])));
 const xmin=Math.min(...xs),xmax=Math.max(...xs),ymax=Math.max(...ys)*1.12,dp=ymax<1?2:1;
 const fx=x=>mL+(o.xlog?(lg(x)-lg(xmin))/(lg(xmax)-lg(xmin)):(x-xmin)/((xmax-xmin)||1))*pw;
 const fy=y=>mT+ph-(y/ymax)*ph;
 let s=`<svg viewBox="0 0 ${W} ${H}" class="chartsvg" preserveAspectRatio="xMidYMid meet">`;
 for(const yv of ticks(ymax)){const y=fy(yv).toFixed(1);
  s+=`<line x1="${mL}" y1="${y}" x2="${W-mR}" y2="${y}" class="cgrid" /><text x="${mL-5}" y="${(+y+3).toFixed(1)}" class="cax cay">${+yv.toFixed(2)}</text>`;}
 (o.xticks||xs).forEach((xv,i)=>{s+=`<text x="${fx(xv).toFixed(1)}" y="${H-mB+15}" class="cax cx">${o.xlab?o.xlab[i]:xv}</text>`;});
 s+=`<text x="${mL+pw/2}" y="${H-6}" class="caxl">${o.xlabel}</text>`;
 s+=`<text transform="rotate(-90 11 ${mT+ph/2})" x="11" y="${mT+ph/2}" class="caxl">${o.ylabel}</text>`;
 o.series.forEach(sr=>{
  if(sr.pts.length>1)s+=`<polyline points="${sr.pts.map(p=>fx(p[0]).toFixed(1)+','+fy(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${sr.color}" stroke-width="2"${sr.dash?' stroke-dasharray="5 4"':''} />`;
  sr.pts.forEach(p=>{s+=`<circle cx="${fx(p[0]).toFixed(1)}" cy="${fy(p[1]).toFixed(1)}" r="3.5" fill="${sr.color}" class="cpt" data-l="${sr.name}, ${p[0]} tokens of context: ${p[1]} ${o.unit||'tok/s'}" />`;});
 });
 const leg=o.series.filter(sr=>!sr.nolegend);
 el.innerHTML=s+'</svg>'+`<div class=clegend>${leg.map(sr=>`<span><i style="background:${sr.dash?`repeating-linear-gradient(90deg,${sr.color} 0 .27em,transparent .27em .45em)`:sr.color}"></i>${sr.name}</span>`).join('')}</div>`;
 ctips(el);
}
function svgMem(el,o){
 const W=460,H=199,mL=42,mR=10,mT=10,mB=42,pw=W-mL-mR,ph=H-mT-mB;
 const X=o.x,xmax=X[X.length-1];
 const kv=X.map(L=>o.kvb*L/1e9),tot=X.map((_,i)=>o.w+kv[i]+o.act);
 const ymax=Math.max(Math.max(...tot),o.ram)*1.14;
 const fx=x=>mL+(x/xmax)*pw,fy=y=>mT+ph-(y/ymax)*ph;
 const band=(lo,hi,col)=>{const up=X.map((x,i)=>fx(x).toFixed(1)+','+fy(hi[i]).toFixed(1));
  const dn=X.map((x,i)=>fx(x).toFixed(1)+','+fy(lo[i]).toFixed(1)).reverse();
  return `<polygon points="${up.concat(dn).join(' ')}" fill="${col}" fill-opacity="0.5" stroke="${col}" stroke-width="1" />`;};
 const z=X.map(()=>0),wA=X.map(()=>o.w),wk=X.map((_,i)=>o.w+kv[i]);
 let s=`<svg viewBox="0 0 ${W} ${H}" class="chartsvg" preserveAspectRatio="xMidYMid meet">`;
 for(const yv of ticks(ymax)){const y=fy(yv).toFixed(1);
  s+=`<line x1="${mL}" y1="${y}" x2="${W-mR}" y2="${y}" class="cgrid" /><text x="${mL-5}" y="${(+y+3).toFixed(1)}" class="cax cay">${+yv.toFixed(2)}</text>`;}
 s+=band(z,wA,'#0969da')+band(wA,wk,'#1a7f37')+band(wk,tot,'#b5852c');
 s+=`<line x1="${mL}" y1="${fy(o.ram).toFixed(1)}" x2="${W-mR}" y2="${fy(o.ram).toFixed(1)}" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" />`;
 s+=`<text x="${W-mR}" y="${(fy(o.ram)-4).toFixed(1)}" class="cax" text-anchor="end" fill="#cf222e">~${o.ram} GB usable</text>`;
 const Ls=(o.ram-o.w-o.act)/(o.kvb/1e9);
 if(Ls>0&&Ls<xmax){const xi=fx(Ls).toFixed(1),yr=fy(o.ram).toFixed(1);
  s+=`<line x1="${xi}" y1="${yr}" x2="${xi}" y2="${mT+ph}" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="3 3" />`;
  s+=`<circle cx="${xi}" cy="${yr}" r="4" fill="#cf222e" class="cpt" data-l="modeled sum meets ${o.ram} GB ceiling at ~${Math.round(Ls/1000)}k tokens" />`;
  s+=`<text x="${xi}" y="${(fy(o.ram)-7).toFixed(1)}" class="cax" text-anchor="middle" fill="#cf222e">~${Math.round(Ls/1000)}k</text>`;}
 X.forEach((x,i)=>{s+=`<circle cx="${fx(x).toFixed(1)}" cy="${fy(tot[i]).toFixed(1)}" r="3.5" fill="#2a2823" class="cpt" data-l="${x} tokens: weights ${o.w.toFixed(2)} + KV cache ${kv[i].toFixed(2)} + activations ${o.act} = ${tot[i].toFixed(2)} GB" />`;});
 X.forEach(x=>{s+=`<text x="${fx(x).toFixed(1)}" y="${H-mB+15}" class="cax cx">${x>=1024?x/1024+'k':x}</text>`;});
 s+=`<text x="${mL+pw/2}" y="${H-6}" class="caxl">context length (tokens)</text>`;
 s+=`<text transform="rotate(-90 11 ${mT+ph/2})" x="11" y="${mT+ph/2}" class="caxl">GB per box</text>`;
 el.innerHTML=s+'</svg>'+`<div class=clegend><span><i style="background:#0969da"></i>weights (4-bit)</span><span><i style="background:#1a7f37"></i>KV cache (8-bit)</span><span><i style="background:#b5852c"></i>activations</span></div>`;
 ctips(el);
}
svgChart(document.getElementById('chart2'),{xlabel:'context length (tokens)',ylabel:'decode tok/s',xlog:true,xticks:CX,xlab:CLAB,
 series:[{name:'measured',color:'#0969da',pts:CX.slice(0,7).map((x,i)=>[x,DEC[i]])},
         {name:'extrapolated',color:'#0969da',dash:true,pts:[[CX[6],DEC[6]],[CX[7],DEC[7]]]}]});
</script>
<script>(function(){var last=0;function ph(){try{var h=Math.max(document.body.scrollHeight,document.body.offsetHeight);if(Math.abs(h-last)>2){last=h;parent.postMessage({sg:1,h:h+2},"*");}}catch(e){}}addEventListener("load",ph);addEventListener("resize",ph);if(document.readyState!=="loading")ph();else addEventListener("DOMContentLoaded",ph);if(window.ResizeObserver){new ResizeObserver(ph).observe(document.body);}setTimeout(ph,150);setTimeout(ph,600);setTimeout(ph,1500);})();</script>
</body></html>
