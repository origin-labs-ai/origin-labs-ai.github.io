<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><style>
html,body{margin:0;padding:16px;background:#ffffff;color:#2a2823;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:660px;margin:0 auto}
</style></head><body>
<div class="wrap">
<svg viewBox="0 0 660 384" width="100%" style="max-width:660px">
  <text x="336" y="24" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2a2823">Qwen3.5-9B inference setup success rate vs context window</text>
  <text x="336" y="42" text-anchor="middle" font-size="11" fill="#6d6658">with compaction and resume &middot; Wilson 95% intervals</text>
  <!-- gridlines + y ticks (0..100%) -->
  <line x1="52" y1="350" x2="620" y2="350" stroke="#e2ddd0"/><text x="46" y="354" text-anchor="end" font-size="10" fill="#6d6658">0</text>
  <line x1="52" y1="292" x2="620" y2="292" stroke="#e2ddd0"/><text x="46" y="296" text-anchor="end" font-size="10" fill="#6d6658">20</text>
  <line x1="52" y1="234" x2="620" y2="234" stroke="#e2ddd0"/><text x="46" y="238" text-anchor="end" font-size="10" fill="#6d6658">40</text>
  <line x1="52" y1="176" x2="620" y2="176" stroke="#e2ddd0"/><text x="46" y="180" text-anchor="end" font-size="10" fill="#6d6658">60</text>
  <line x1="52" y1="118" x2="620" y2="118" stroke="#e2ddd0"/><text x="46" y="122" text-anchor="end" font-size="10" fill="#6d6658">80</text>
  <line x1="52" y1="60" x2="620" y2="60" stroke="#e2ddd0"/><text x="46" y="64" text-anchor="end" font-size="10" fill="#6d6658">100</text>
  <text x="15" y="205" text-anchor="middle" font-size="11" fill="#6d6658" transform="rotate(-90 15 205)">inference setup success rate (%)</text>
  <!-- bars (8k=0% has no bar); teal &lt;32k, pink &ge;32k, lavender=full ref -->
  <rect x="196" y="286" width="64" height="64" fill="#3f7f79"/>
  <rect x="308" y="176" width="64" height="174" fill="#cc785c"/>
  <rect x="420" y="124" width="64" height="226" fill="#cc785c"/>
  <rect x="532" y="156" width="64" height="194" fill="#8250df"/>
  <!-- Wilson CI whiskers (MUT), 8k..64k -->
  <g stroke="#6d6658" stroke-width="1.5">
    <line x1="116" y1="350" x2="116" y2="263"/><line x1="109" y1="350" x2="123" y2="350"/><line x1="109" y1="263" x2="123" y2="263"/>
    <line x1="228" y1="333" x2="228" y2="190"/><line x1="221" y1="333" x2="235" y2="333"/><line x1="221" y1="190" x2="235" y2="190"/>
    <line x1="340" y1="260" x2="340" y2="109"/><line x1="333" y1="260" x2="347" y2="260"/><line x1="333" y1="109" x2="347" y2="109"/>
    <line x1="452" y1="220" x2="452" y2="77"/><line x1="445" y1="220" x2="459" y2="220"/><line x1="445" y1="77" x2="459" y2="77"/>
  </g>
  <!-- rate labels (above whisker) -->
  <g font-size="13" font-weight="700" fill="#2a2823" text-anchor="middle">
    <text x="116" y="257">0%</text><text x="228" y="184">22%</text><text x="340" y="103">60%</text><text x="452" y="71">78%</text><text x="564" y="150">67%</text>
  </g>
  <!-- pass counts (k/n) near bar base -->
  <g font-size="10" font-weight="600" text-anchor="middle">
    
  </g>
  <!-- x labels -->
  <g font-size="11.5" fill="#2a2823" text-anchor="middle">
    <text x="116" y="370">8k</text><text x="228" y="370">16k</text><text x="340" y="370">32k</text><text x="452" y="370">64k</text><text x="564" y="370">full</text>
  </g>
</svg>
</div>
<script>(function(){var last=0;function ph(){try{var h=Math.max(document.body.scrollHeight,document.body.offsetHeight);if(Math.abs(h-last)>2){last=h;parent.postMessage({sg:1,h:h+2},'*');}}catch(e){}}addEventListener('load',ph);addEventListener('resize',ph);if(document.readyState!=='loading')ph();else addEventListener('DOMContentLoaded',ph);if(window.ResizeObserver){new ResizeObserver(ph).observe(document.body);}setTimeout(ph,150);setTimeout(ph,600);setTimeout(ph,1500);})();</script>
</body></html>
