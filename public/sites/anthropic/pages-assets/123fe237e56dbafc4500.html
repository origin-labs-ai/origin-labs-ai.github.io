<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<meta charset="utf-8">
<title>YFCC100M Photo Geolocation</title>
<style>
:root{--bg:#fbfaf7;--ink:#161616;--ink2:#5a5955;--ink3:#8d8b85;--grid:#e3e1da;--axis:#8d8b85;--card:#ffffff;--rule:#e3e1da;--accent:#b4533a;--sep:#b9b7b0}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
h1{font-weight:500;font-size:22px;margin:0 0 4px;text-wrap:balance}
p.sub{margin:0 0 18px;color:var(--ink2);max-width:90ch}
figure{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 16px 12px}
figure h2{font-weight:500;font-size:18px;margin:0 0 2px;text-align:center;text-wrap:balance}
figure .pt{font-size:14px;color:var(--accent);text-align:center;margin:14px 0 2px}
.svgwrap{overflow-x:auto}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--ink);font-family:inherit}
svg .t2{fill:var(--ink2)} svg .t3{fill:var(--ink3)}
svg .grid{stroke:var(--grid);stroke-dasharray:3 3} svg .axis{stroke:var(--axis)} svg .sep{stroke:var(--sep);stroke-dasharray:2 3}
figcaption{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.45} figcaption a{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12.5px;color:var(--ink2);margin:6px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px} .legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
.picker{border-bottom:1px solid var(--rule);padding:10px 0 10px;margin:8px 0 4px}
.picker .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0}
.picker .lbl{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;min-width:112px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 8px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;line-height:1.3}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.chip[aria-pressed="false"]{color:var(--ink3)} .chip[aria-pressed="false"] i{background:transparent}
.chip:hover{border-color:var(--ink3)} .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.picker .acts{margin-left:auto;display:flex;gap:4px}
.picker .acts button{font:inherit;font-size:12px;color:var(--ink2);background:none;border:0;cursor:pointer;padding:3px 6px;border-radius:5px;text-decoration:underline dotted}
.picker .acts button:hover{color:var(--ink)}
.empty{fill:var(--ink3);font-size:14px}
.svgwrap{position:relative}
svg .series{transition:opacity .15s} svg .series .hit{fill:transparent;stroke:none;cursor:pointer}
svg.focused .series:not(.focus){opacity:.14} svg.focused .series.focus polyline{stroke-width:3.2}
svg.focused rect.bar:not(.focus),svg.focused line.bar:not(.focus){opacity:.22} svg.focused text.bar:not(.focus){opacity:.35}
.legend span{cursor:pointer;border-radius:5px;padding:1px 5px;margin:-1px -5px} .legend span:hover{background:var(--grid)}
.legend.focused span:not(.focus){opacity:.4} .legend span.pinned{background:var(--grid);color:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tip b{font-weight:600} .tip.show{opacity:1}
.hint{font-size:12px;color:var(--ink3);text-align:center;margin:4px 0 0}
</style>
<main>
<figure id="yfcc"><h2>Geolocating ground-level photos (YFCC100M, 6,000 photos)</h2>
<section class="picker" aria-label="Choose models to compare">
<div class="row"><span class="lbl">Claude models</span><span id="pick-claude" class="row" style="margin:0"></span><span class="acts"><button type="button" data-act="all">Select all</button><button type="button" data-act="none">Clear</button><button type="button" data-act="reset">Reset</button></span></div>
<div class="row"><span class="lbl">Open-weights</span><span id="pick-open" class="row" style="margin:0"></span></div>
</section>
<div class="pt">Guesses within a distance threshold. Higher is better.</div><div class="svgwrap"><svg id="yfcc-curves" viewBox="0 0 1100 430"></svg></div><div class="legend" id="yfcc-legend"></div><p class="hint">Hover a point to see its value. Hover or click a line or legend entry to spotlight that model, and click again or press Esc to release.</p>
<div class="pt">Median distance error, with human reference lines. Lower is better.</div><div class="svgwrap"><svg id="yfcc-bars" viewBox="0 0 1100 400"></svg></div>
<figcaption>The dashed lines show the median distance error of human GeoGuessr players. Data from <a href="https://arxiv.org/abs/2307.05845" target="_blank" rel="noopener">Haas et al. (2024)</a>. Whiskers show 95% confidence intervals.</figcaption></figure>
</main>
<script>
const DEFAULT_HIDDEN = new Set(["Opus 4.5","Opus 4.6","Opus 4.7","Opus 4.8","Kimi K2.7","GLM 5.2"]);
const ORDER_YFCC = {claude:["Sonnet 5", "Opus 4.5", "Opus 4.6", "Opus 4.7", "Opus 4.8", "Opus 5", "Mythos Preview", "Mythos 5"], open:["Kimi K2.7", "Kimi K3"]};
const YF_CI={"curves":{"Mythos Preview":[1.03,1.22,1.19,1.06,0.9],"Mythos 5":[1.02,1.22,1.2,1.1,0.97],"Opus 5":[0.92,1.18,1.22,1.17,1.06],"Opus 4.7":[0.91,1.19,1.23,1.18,1.07],"Opus 4.8":[0.84,1.17,1.23,1.18,1.07],"Opus 4.6":[0.91,1.18,1.23,1.2,1.09],"Opus 4.5":[0.89,1.16,1.21,1.19,1.09],"Sonnet 5":[0.71,1.11,1.2,1.2,1.11],"Kimi K3":[0.94,1.2,1.26,1.25,1.17]},"median":{"Mythos Preview":[29.3,45.4],"Mythos 5":[36.5,59.7],"Opus 5":[151.9,211.3],"Opus 4.7":[179.1,238.8],"Opus 4.8":[191.5,251.1],"Opus 4.6":[238.7,306.0],"Opus 4.5":[260.5,330.1],"Sonnet 5":[351.0,420.6],"Kimi K3":[349.2,454.1]}};
const YF={ci:YF_CI,thr:[1,25,200,750,2500],
 curves:{"Mythos Preview":[23.74,47.83,61.74,75.17,83.72],"Mythos 5":[23.12,46.64,59.51,72.26,81.03],"Opus 5":[18.02,38.05,50.76,64.59,75.01],"Opus 4.7":[16.56,37.24,49.58,63.80,74.66],"Opus 4.8":[14.24,35.63,49.23,63.58,74.38],"Opus 4.6":[16.69,35.07,47.28,61.83,74.11],"Opus 4.5":[16.18,34.82,46.54,60.92,72.93],"Sonnet 5":[9.92,29.81,42.89,58.03,70.55],"Kimi K3":[16.65,33.80,43.79,56.93,69.22],"Kimi K2.7":[13.60,31.34,42.40,55.97,68.18]},
 median:{"Mythos Preview":37.0,"Mythos 5":47.2,"Opus 5":180.9,"Opus 4.7":211.7,"Opus 4.8":219.5,"Opus 4.6":271.2,"Opus 4.5":292.0,"Sonnet 5":384.1,"Kimi K3":385.4,"Kimi K2.7":455.7},
 humans:[["GeoGuessr players, Gold Division (1)",1714,"2 6"],["Master Division (1)",174,"10 4 2 4"],["Champion Division (1)",151,"14 5"]]};

const COLOR={"Mythos Preview":"#8a6dc4","Mythos 5":"#47267f","Opus 5":"#0c7350","Opus 4.7":"#55b38f","Opus 4.8":"#2a9670","Opus 4.6":"#86cbae","Opus 4.5":"#b3dec9","Sonnet 5":"#74bdf2","Kimi K3":"#4a5563","Kimi K2.7":"#b7c0ca","GLM 5.2":"#7d8996","NYC":"#c0392b"};
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;parent&&parent.appendChild(e);return e}
const fmtKm=v=>(v>=100?Math.round(v).toLocaleString():v.toFixed(1))+" km";
function curves(svgId,legendId,D,order,opts){
  const svg=document.getElementById(svgId); svg.innerHTML="";
  const W=1100,H=430,m={l:70,r:20,t:14,b:56},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const lx=v=>Math.log10(v), x0=lx(D.thr[0])-0.15, x1=lx(D.thr[D.thr.length-1])+0.1;
  const X=v=>m.l+(lx(v)-x0)/(x1-x0)*pw, Y=v=>m.t+ph-(v/100)*ph;
  for(let g=0;g<=100;g+=20){el("line",{x1:m.l,x2:m.l+pw,y1:Y(g),y2:Y(g),class:"grid"},svg);el("text",{x:m.l-8,y:Y(g)+4,"text-anchor":"end","font-size":12,class:"t2"},svg,g)}
  el("line",{x1:m.l,x2:m.l,y1:m.t,y2:m.t+ph,class:"axis"},svg);el("line",{x1:m.l,x2:m.l+pw,y1:m.t+ph,y2:m.t+ph,class:"axis"},svg);
  D.thr.forEach(t=>el("text",{x:X(t),y:m.t+ph+18,"text-anchor":"middle","font-size":12,class:"t2"},svg,t));
  el("text",{x:m.l+pw/2,y:H-10,"text-anchor":"middle","font-size":13},svg,"Distance threshold (km, log scale)");
  el("text",{x:16,y:m.t+ph/2,"text-anchor":"middle","font-size":13,transform:`rotate(-90 16 ${m.t+ph/2})`},svg,opts.ylab);
  const names=[...order.claude,...order.open].filter(n=>selected.has(n));
  const leg=document.getElementById(legendId); leg.innerHTML="";
  if(!names.length)el("text",{x:m.l+pw/2,y:m.t+ph/2,"text-anchor":"middle",class:"empty"},svg,"No models selected");
  const unit=opts.unit;
  const series=(n,label,vals,line,dot,legendHTML)=>{
    const g=el("g",{class:"series","data-model":n},svg), pts=vals.map((v,i)=>[X(D.thr[i]),Y(v)]);
    el("polyline",{points:pts.map(p=>p.join(",")).join(" "),fill:"none",stroke:COLOR[n],"stroke-linejoin":"round",...line},g);
    const ci=D.ci&&D.ci.curves[n];
    if(ci)pts.forEach((p,i)=>{const y1=Y(Math.max(0,vals[i]-ci[i])),y2=Y(Math.min(100,vals[i]+ci[i]));el("line",{x1:p[0],x2:p[0],y1,y2,stroke:COLOR[n],"stroke-width":1.3},g);[y1,y2].forEach(yy=>el("line",{x1:p[0]-3,x2:p[0]+3,y1:yy,y2:yy,stroke:COLOR[n],"stroke-width":1.3},g))});
    pts.forEach(p=>el("circle",{cx:p[0],cy:p[1],fill:COLOR[n],...dot},g));
    pts.forEach((p,i)=>{const h=el("circle",{cx:p[0],cy:p[1],r:11,class:"hit"},g);
      h.addEventListener("pointerenter",e=>{showTip(svg,e,`<b>${label}</b><br>${vals[i].toFixed(1)}% of ${unit} within ${D.thr[i]} km${ci?`<br>95% CI ${Math.max(0,vals[i]-ci[i]).toFixed(1)} to ${Math.min(100,vals[i]+ci[i]).toFixed(1)}%`:""}`);hover(n)});
      h.addEventListener("pointerleave",()=>{hideTip(svg);hover(null)});
      h.addEventListener("click",e=>{e.stopPropagation();pin(n)})});
    g.addEventListener("pointerenter",()=>hover(n));g.addEventListener("pointerleave",()=>hover(null));
    g.addEventListener("click",e=>{e.stopPropagation();pin(n)});
    const s=document.createElement("span");s.dataset.model=n;s.innerHTML=legendHTML;leg.appendChild(s);
    s.addEventListener("pointerenter",()=>hover(n));s.addEventListener("pointerleave",()=>hover(null));s.addEventListener("click",()=>pin(n));};
  names.forEach(n=>series(n,n,D.curves[n],{"stroke-width":2.4},{r:3.4,stroke:"var(--card)","stroke-width":1},`<i style="background:${COLOR[n]}"></i>${n}`));
  if(D.nyc)series("NYC","Always guessing New York City",D.nyc,{"stroke-width":2,"stroke-dasharray":"6 4"},{r:2.6},`<i style="background:${COLOR.NYC};height:0;border-top:2px dashed ${COLOR.NYC}"></i>always guessing New York City`);
  svg.addEventListener("click",()=>pin(null));
  applyFocus();
}
let hovered=null, pinned=null;
function tipFor(svg){const w=svg.parentElement;let t=w.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";w.appendChild(t)}return t}
function showTip(svg,e,html){const t=tipFor(svg),w=svg.parentElement,r=w.getBoundingClientRect();t.innerHTML=html;t.classList.add("show");
  const x=e.clientX-r.left+w.scrollLeft, y=e.clientY-r.top; const tw=t.offsetWidth;
  t.style.left=Math.min(x+14,w.scrollWidth-tw-4)+"px"; t.style.top=(y-t.offsetHeight-12<0?y+16:y-t.offsetHeight-12)+"px"}
function hideTip(svg){tipFor(svg).classList.remove("show")}
function hover(n){hovered=n;applyFocus()}
function pin(n){pinned=(n===null||pinned===n)?null:n;applyFocus()}
function applyFocus(){const f=pinned||hovered;
  document.querySelectorAll("svg").forEach(s=>s.classList.toggle("focused",!!f));
  document.querySelectorAll(".legend").forEach(l=>l.classList.toggle("focused",!!f));
  document.querySelectorAll("[data-model]").forEach(x=>{x.classList.toggle("focus",!!f&&x.dataset.model===f);x.classList.toggle("pinned",!!pinned&&x.dataset.model===pinned)})}
document.addEventListener("keydown",e=>{if(e.key==="Escape")pin(null)});
function bars(svgId,D,order,opts){
  const svg=document.getElementById(svgId); svg.innerHTML="";
  const W=1100,H=opts.H,m={l:70,r:opts.rlab?150:20,t:30,b:48},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const [lo,hi]=opts.ylog; const Y=v=>m.t+ph-(Math.log10(v)-lo)/(hi-lo)*ph;
  for(let e=Math.ceil(lo);e<=hi;e++){el("line",{x1:m.l,x2:m.l+pw,y1:Y(10**e),y2:Y(10**e),class:"grid"},svg);const t=el("text",{x:m.l-8,y:Y(10**e)+4,"text-anchor":"end","font-size":12,class:"t2"},svg,"10");el("tspan",{"baseline-shift":"super","font-size":9},t,e)}
  if(hi-lo<1.5)for(let e=Math.floor(lo);e<=hi;e++)for(const k of [2,3,5]){const v=k*10**e;if(Math.log10(v)>lo&&Math.log10(v)<hi){el("line",{x1:m.l,x2:m.l+pw,y1:Y(v),y2:Y(v),class:"grid"},svg);el("text",{x:m.l-8,y:Y(v)+4,"text-anchor":"end","font-size":12,class:"t2"},svg,v)}}
  el("line",{x1:m.l,x2:m.l,y1:m.t,y2:m.t+ph,class:"axis"},svg);el("line",{x1:m.l,x2:m.l+pw,y1:m.t+ph,y2:m.t+ph,class:"axis"},svg);
  el("text",{x:16,y:m.t+ph/2,"text-anchor":"middle","font-size":13,transform:`rotate(-90 16 ${m.t+ph/2})`},svg,"Median error (km, log scale)");
  const cl=order.claude.filter(n=>selected.has(n)), op=order.open.filter(n=>selected.has(n));
  const names=[...cl,...op], n=names.length, both=cl.length&&op.length, gap=both?0.6:0, slot=n?pw/(n+gap):pw, bw=Math.min(slot*0.58,110);
  const cx=i=>m.l+slot*(i+0.5)+(i>=cl.length?slot*gap:0);
  if(!n)el("text",{x:m.l+pw/2,y:m.t+ph/2,"text-anchor":"middle",class:"empty"},svg,"No models selected");
  const sepX=m.l+slot*cl.length+slot*gap/2;
  if(both)el("line",{x1:sepX,x2:sepX,y1:m.t,y2:m.t+ph,class:"sep"},svg);
  if(cl.length)el("text",{x:both?(m.l+sepX)/2:m.l+pw/2,y:m.t+16,"text-anchor":"middle","font-size":12.5,class:"t2"},svg,"Claude models");
  if(op.length)el("text",{x:both?(sepX+m.l+pw)/2:m.l+pw/2,y:m.t+16,"text-anchor":"middle","font-size":12.5,class:"t2"},svg,"Open-weights models");
  const tags=[];
  (opts.hlines||[]).forEach(([lab,v,dash,color])=>{el("line",{x1:m.l,x2:m.l+pw,y1:Y(v),y2:Y(v),stroke:color||"var(--ink2)","stroke-width":2,"stroke-dasharray":dash,opacity:.85},svg);
    if(opts.rlab)tags.push({y:Y(v)+4,t:lab.replace(/GeoGuessr players, | \(1\)| Division/g,"")+" "+fmtKm(v)});});
  tags.sort((a,b)=>a.y-b.y);for(let k=1;k<tags.length;k++){const d=13-(tags[k].y-tags[k-1].y);if(d>0){tags[k-1].y-=d/2;tags[k].y+=d/2;for(let j=k-1;j>0&&tags[j].y-tags[j-1].y<13;j--)tags[j-1].y=tags[j].y-13;}}
  tags.forEach(g=>el("text",{x:m.l+pw+6,y:g.y,"font-size":11,class:"t3"},svg,g.t));
  names.forEach((nm,i)=>{const v=D.median[nm],x=cx(i)-bw/2,y=Y(v);const r=el("rect",{x,y,width:bw,height:m.t+ph-y,fill:COLOR[nm],rx:1.5,class:"bar","data-model":nm,style:"cursor:pointer"},svg);
    const mci=D.ci&&D.ci.median[nm];
    if(mci){const y1=Y(mci[0]),y2=Y(mci[1]),wx=cx(i);[["var(--card)",3.6],["var(--ink2)",1.4]].forEach(([c,w])=>{el("line",{x1:wx,x2:wx,y1,y2,stroke:c,"stroke-width":w,"stroke-linecap":"round",class:"bar","data-model":nm},svg);[y1,y2].forEach(yy=>el("line",{x1:wx-4,x2:wx+4,y1:yy,y2:yy,stroke:c,"stroke-width":w,"stroke-linecap":"round",class:"bar","data-model":nm},svg))});}
    el("text",{x:cx(i),y:(mci?Y(mci[1]):y)-6,"text-anchor":"middle","font-size":12.5,class:"bar","data-model":nm},svg,fmtKm(v));
    el("text",{x:cx(i),y:m.t+ph+18,"text-anchor":"middle","font-size":12.5,class:"t2 bar","data-model":nm},svg,nm);
    r.addEventListener("pointerenter",e=>{if(mci)showTip(svg,e,`<b>${nm}</b><br>Median ${fmtKm(v)}<br>95% CI ${fmtKm(mci[0])} to ${fmtKm(mci[1])}`);hover(nm)});r.addEventListener("pointerleave",()=>{hideTip(svg);hover(null)});r.addEventListener("click",e=>{e.stopPropagation();pin(nm)})});
  svg.addEventListener("click",()=>pin(null));
  applyFocus();
}
function makePicker(ORDER,STORE,render){
  const ALL_CLAUDE=[...ORDER.claude].reverse(), ALL_OPEN=[...ORDER.open].reverse(), ALL=[...ALL_CLAUDE,...ALL_OPEN];
  const defaults=()=>new Set(ALL.filter(n=>!DEFAULT_HIDDEN.has(n)));
  window.selected=defaults();
  try{const v=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(v))selected=new Set(v.filter(n=>ALL.includes(n)))}catch{}
  const save=()=>{try{localStorage.setItem(STORE,JSON.stringify([...selected]))}catch{}};
  const chipRow=(id,list)=>{const host=document.getElementById(id);host.innerHTML="";list.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.model=n;b.style.setProperty("--c",COLOR[n]);b.innerHTML=`<i></i>${n}`;b.addEventListener("click",()=>{selected.has(n)?selected.delete(n):selected.add(n);save();rerender()});host.appendChild(b)})};
  chipRow("pick-claude",ALL_CLAUDE);chipRow("pick-open",ALL_OPEN);
  const rerender=()=>{document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(selected.has(b.dataset.model))));render()};
  document.querySelectorAll(".picker .acts button").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.act;selected=a==="all"?new Set(ALL):a==="none"?new Set():defaults();save();rerender()}));
  rerender();
}

makePicker(ORDER_YFCC,"yfcc-charts.selected",()=>{
  curves("yfcc-curves","yfcc-legend",YF,ORDER_YFCC,{ylab:"Guesses within threshold (% of all photos)",unit:"photos"});
  bars("yfcc-bars",YF,ORDER_YFCC,{H:400,ylog:[1,4],hlines:YF.humans.map(h=>[h[0],h[1],h[2]]),rlab:true});
});
</script>
</body>
</html>
