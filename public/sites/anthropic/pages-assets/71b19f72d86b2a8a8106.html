<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM ATT&CK Navigator</title>
<style>
  :root {
    --bg: #fafaf9;
    --bg-card: #ffffff;
    --border: #d6d3d1;
    --border-strong: #1c1917;
    --text: #1c1917;
    --muted: #57534e;
    --header-bg: #f5f5f4;
    --tactic-grid: #E8E6DC;
    --link: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.4;
  }
  .container { max-width: 100%; margin: 0 auto; padding: 24px; }
  @media (max-width: 640px) {
    .container { padding: 16px; }
  }
  header { margin-bottom: 20px; }
  .navigator-panel {
    background: #E8E6DC;
    border-radius: 8px;
    padding: 16px;
  }
  .navigator-panel > :last-child { margin-bottom: 0; }
  h1 { font-size: 22px; margin: 0 0 4px 0; letter-spacing: -0.01em; font-weight: 700; }
  .subtitle { font-size: 14px; color: var(--muted); max-width: 720px; margin: 0; }
  em { font-style: italic; }

  .toolbar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar-label { font-weight: 600; color: #44403c; }
  select {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    background: white;
    font: inherit;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #44403c;
    margin-bottom: 12px;
  }
  .legend-title { font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-size: 11px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-swatch { display: inline-block; width: 16px; height: 16px; border: 1px solid var(--border); }
  .legend-swatch.observed { border: 2px solid #000; background: white; }

  .matrix-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    background: white;
  }
  .matrix {
    display: flex;
    gap: 1px;
    background: var(--tactic-grid);
    padding: 1px;
    min-width: min-content;
  }
  .tactic-col {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    width: 150px;
    gap: 2px;
  }
  .tactic-head {
    padding: 8px;
    background: var(--header-bg);
    border: 1px solid var(--border);
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    min-height: 52px;
  }
  .tactic-name { font-size: 11px; font-weight: 700; line-height: 1.15; }
  .tactic-count { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .cell {
    text-align: left;
    border: 1px solid #ddd;
    padding: 4px 5px;
    min-height: 42px;
    font-size: 10.5px;
    line-height: 1.15;
    overflow: hidden;
    word-break: break-word;
    hyphens: auto;
    background: white;
    color: var(--text);
    cursor: default;
    font-family: inherit;
    width: 100%;
  }
  .cell.observed { border: 2px solid #000; cursor: pointer; }
  .cell.observed .tech-name { font-weight: 600; }
  .cell:not(.observed) .tech-name { font-weight: 500; }
  .cell.observed:hover { filter: brightness(0.95); }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white;
    border: 2px solid var(--border-strong);
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 700px;
    margin: 32px 0;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid #e7e5e4;
    gap: 12px;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin: 0; }
  .modal-meta {
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    flex-wrap: wrap;
  }
  .modal-meta a { color: var(--link); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .modal-meta a:hover { text-decoration: underline; }
  .modal-meta .sep { color: #a8a29e; }
  .close-btn {
    border: none;
    background: transparent;
    padding: 4px;
    cursor: pointer;
    border-radius: 4px;
    color: var(--text);
    display: flex;
  }
  .close-btn:hover { background: var(--header-bg); }

  .modal-section { padding: 16px; }
  .modal-section.gray { background: var(--bg); border-bottom: 1px solid #e7e5e4; }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .stat-row { display: flex; font-size: 14px; margin-bottom: 6px; }
  .stat-row:last-child { margin-bottom: 0; }
  .stat-label { width: 180px; color: var(--muted); }
  .stat-value { font-weight: 600; }
  .stat-note { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; }
  .stat-divider {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #d6d3d1;
    display: flex;
    align-items: center;
  }
  .headline-pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 700;
  }
  .stat-divider .stat-label { font-weight: 600; color: #44403c; }

  .sub-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px;
    background: var(--bg);
    border-left: 4px solid #d6d3d1;
    border-radius: 2px;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .sub-row:last-child { margin-bottom: 0; }
  .sub-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--link);
    text-decoration: none;
    width: 80px;
    flex-shrink: 0;
  }
  .sub-id:hover { text-decoration: underline; }
  .sub-name { flex: 1; color: #292524; }
  .sub-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .sub-score {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>LLM ATT&CK Navigator</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="navigator-panel">
  <div class="toolbar">
    <label class="toolbar-label" for="color-mode">Color cells by:</label>
    <select id="color-mode">
      <option value="raw_mean">Raw mean ARiES</option>
      <option value="adjusted">Adjusted (mean x prevalence)</option>
      <option value="pct_actors" selected>% of banned accounts</option>
    </select>
  </div>

  <div class="legend" id="legend"></div>

  <div class="matrix-scroll">
    <div class="matrix" id="matrix"></div>
  </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal"></div>
</div>

const RISK_COLORS = { critical: "#F44336", high: "#FF9800", medium: "#FFC107", low: "#66BB6A", none: "#FFFFFF" };
const PCT_COLORS  = ["#f9d976", "#f5a623", "#e8540c", "#b91c1c", "#7f1d1d"];

function getRiskColor(score) {
  if (score === null || score === undefined || isNaN(score)) return RISK_COLORS.none;
  const s = Number(score);
  if (s >= 85) return RISK_COLORS.critical;
  if (s >= 70) return RISK_COLORS.high;
  if (s >= 50) return RISK_COLORS.medium;
  return RISK_COLORS.low;
}
function scoreToCategory(score) {
  if (score === null || score === undefined || isNaN(score)) return "Unknown";
  const s = Number(score);
  if (s >= 85) return "Critical";
  if (s >= 70) return "High";
  if (s >= 50) return "Medium";
  return "Low";
}
function getPctColor(pct) {
  if (pct === null || pct === undefined || isNaN(pct)) return RISK_COLORS.none;
  const p = Number(pct);
  if (p >= 50) return PCT_COLORS[4];
  if (p >= 25) return PCT_COLORS[3];
  if (p >= 10) return PCT_COLORS[2];
  if (p >= 2)  return PCT_COLORS[1];
  if (p > 0)   return PCT_COLORS[0];
  return RISK_COLORS.none;
}
function fgFor(bg) {
  if (!bg || /^#fff(fff)?$/i.test(bg)) return "#1c1917";
  const m = bg.match(/^#([0-9a-f]{6})$/i);
  if (!m) return "#1c1917";
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;
  const lin = (c) => { const s = c / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return L > 0.55 ? "#1c1917" : "#ffffff";
}
function pickColor(agg, colorMode) {
  if (!agg) return RISK_COLORS.none;
  if (colorMode === "pct_actors") return getPctColor(agg.pct_actors);
  const v = agg[colorMode];
  return v !== null && v !== undefined ? getRiskColor(v) : RISK_COLORS.none;
}

function buildDomainView(mapping) {
  const tactics = [];
  const techniqueIndex = {};
  for (const [taId, td] of Object.entries(mapping.tactic_to_techniques)) {
    const tacticEntry = { id: taId, name: td.tactic_name, techniques: [] };
    for (const tech of td.techniques) {
      tacticEntry.techniques.push({ id: tech.id, name: tech.name, sub_techniques: tech.sub_techniques || [] });
      techniqueIndex[tech.id] = { name: tech.name, tactic_name: td.tactic_name };
      for (const sub of tech.sub_techniques || []) {
        techniqueIndex[sub.id] = { name: sub.name, parent: tech.id, tactic_name: td.tactic_name };
      }
    }
    tacticEntry.techniques.sort((a, b) => a.name.localeCompare(b.name));
    tactics.push(tacticEntry);
  }
  return { tactics, techniqueIndex };
}

// ----- helpers -----
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "style" && v && typeof v === "object") {
      for (const [sk, sv] of Object.entries(v)) e.style[sk] = sv;
    } else if (k === "class") {
      e.className = v;
    } else if (k.startsWith("on") && typeof v === "function") {
      e.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (k === "html") {
      e.innerHTML = v;
    } else {
      e.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    e.append(c instanceof Node ? c : document.createTextNode(c));
  }
  return e;
}

    ].forEach(([label, color]) => {
      root.append(el("span", { class: "legend-item" },
        el("span", { class: "legend-swatch", style: { backgroundColor: color } }),
        label
      ));
    });
  } else {
    root.append(el("span", { class: "legend-title" }, "ARiES:"));
    [
      ["Low (0-49)", RISK_COLORS.low],
      ["Medium (50-69)", RISK_COLORS.medium],
      ["High (70-84)", RISK_COLORS.high],
      ["Critical (85-100)", RISK_COLORS.critical],
    ].forEach(([label, color]) => {
      root.append(el("span", { class: "legend-item" },
        el("span", { class: "legend-swatch", style: { backgroundColor: color } }),
        label
      ));
    });
  }
}

// ----- matrix -----
function renderMatrix() {
  const root = document.getElementById("matrix");
  root.innerHTML = "";
  for (const tactic of view.tactics) {
    const col = el("div", { class: "tactic-col" });
    col.append(el("div", { class: "tactic-head" },
      el("div", { class: "tactic-name" }, tactic.name),
      el("div", { class: "tactic-count" }, `${tactic.techniques.length} techniques`)
    ));
    for (const tech of tactic.techniques) {
      const agg = aggs[tech.id];
      const observed = !!agg;
      const bg = pickColor(agg, colorMode);
      const cell = el("button", {
        class: "cell" + (observed ? " observed" : ""),
        type: "button",
        title: observed ? `${tech.name} - click for details` : tech.name,
        style: { backgroundColor: bg, color: fgFor(bg) },
      });
      if (!observed) cell.disabled = true;
      cell.append(el("div", { class: "tech-name" }, tech.name));
      if (observed) cell.addEventListener("click", () => openModal(tech.id, tactic.name));
      col.append(cell);
    }
    root.append(col);
  }
}

// ----- modal -----
function openModal(techId, tacticName) {
  const agg = aggs[techId];
  if (!agg) return;
  const idxEntry = view.techniqueIndex[techId] || {};
  const techName = idxEntry.name || techId;
  const mitreUrl = `https://attack.mitre.org/versions/v18/techniques/${techId.replace(".", "/")}/`;

  // Sub-techniques (dedupe — some parents appear under multiple tactics)
  const subTechs = [];
  if (!techId.includes(".")) {
    const seen = new Set();
    for (const tactic of view.tactics) {
      for (const t of tactic.techniques) {
        if (t.id === techId) {
          for (const sub of t.sub_techniques || []) {
            if (seen.has(sub.id)) continue;
            if (aggs[sub.id]) {
              seen.add(sub.id);
              subTechs.push({ id: sub.id, name: sub.name, agg: aggs[sub.id] });
            }
          }
        }
      }
    }
    subTechs.sort((a, b) => a.id.localeCompare(b.id));
  }

  // Headline
  let headlineScore, headlineLabel, headlineColor;
  if (colorMode === "pct_actors") {
    headlineScore = agg.pct_actors !== null ? `${agg.pct_actors}%` : "N/A";
    headlineLabel = "% of Banned Accounts";
    headlineColor = getPctColor(agg.pct_actors);
  } else {
    const v = colorMode === "raw_mean" ? agg.raw_mean : agg.adjusted;
    headlineScore = v !== null ? `${v} (${scoreToCategory(v)})` : "N/A";
    headlineLabel = colorMode === "raw_mean" ? "Raw Mean ARiES" : "Adjusted ARiES";
    headlineColor = getRiskColor(v);
  }

  const modal = document.getElementById("modal");
  modal.innerHTML = "";

  // Header
  const head = el("div", { class: "modal-head" });
  const headLeft = el("div", { style: { flex: "1", minWidth: "0" } },
    el("h3", { class: "modal-title" }, techName),
    el("div", { class: "modal-meta" },
      el("a", { href: mitreUrl, target: "_blank", rel: "noopener noreferrer" },
        techId,
        el("span", { html: "&#x2197;" })
      ),
      el("span", { class: "sep" }, "|"),
      el("span", null, `Tactic: ${tacticName}`)
    )
  );
  head.append(headLeft);
  head.append(el("button", { class: "close-btn", onclick: closeModal, "aria-label": "Close" }, "✕"));
  modal.append(head);

  // Activity section
  const act = el("div", { class: "modal-section gray" });
  act.append(el("div", { class: "section-label" }, "Observed Activity"));
  act.append(stat("Distinct banned accounts:", `${agg.n_actors}`, `(${agg.pct_actors}% of ${totalActors} banned accounts)`));
  act.append(stat("Total observations:", `${agg.count}`));
  act.append(el("div", { class: "section-label", style: { marginTop: "16px", marginBottom: "8px" } }, "ARiES Risk Score"));
  act.append(stat(
    "Raw mean (avg ARiES):",
    agg.raw_mean !== null ? `${agg.raw_mean}` : "N/A",
    agg.n_scored > 0 ? `(n=${agg.n_scored} scored observations)` : ""
  ));
  if (colorMode === "adjusted") {
    act.append(stat("Prevalence factor:", `x${agg.prevalence.toFixed(2)}`));
  }
  // Headline pill
  const head2 = el("div", { class: "stat-row stat-divider" });
  head2.append(el("span", { class: "stat-label" }, `${headlineLabel}:`));
  head2.append(el("span", {
    class: "headline-pill",
    style: { backgroundColor: headlineColor, color: fgFor(headlineColor) }
  }, headlineScore));
  act.append(head2);
  modal.append(act);

  // Sub-techniques
  if (subTechs.length) {
    const sec = el("div", { class: "modal-section" });
    sec.append(el("div", { class: "section-label" }, `Sub-techniques observed (${subTechs.length})`));
    for (const sub of subTechs) {
      const subBg = pickColor(sub.agg, colorMode);
      let subDisplay;
      if (colorMode === "pct_actors") {
        subDisplay = `${sub.agg.pct_actors}%`;
      } else {
        const v = colorMode === "raw_mean" ? sub.agg.raw_mean : sub.agg.adjusted;
        subDisplay = v !== null ? v : "N/A";
      }
      const row = el("div", { class: "sub-row", style: { borderLeftColor: subBg } });
      row.append(el("a", {
        class: "sub-id",
        href: `https://attack.mitre.org/versions/v18/techniques/${sub.id.replace(".", "/")}/`,
        target: "_blank", rel: "noopener noreferrer",
      }, sub.id));
      row.append(el("span", { class: "sub-name" }, sub.name));
      row.append(el("span", { class: "sub-meta" }, `${sub.agg.n_actors} banned accounts (${sub.agg.pct_actors}%)`));
      row.append(el("span", {
        class: "sub-score",
        style: { backgroundColor: subBg, color: fgFor(subBg) }
      }, String(subDisplay)));
      sec.append(row);
    }
    modal.append(sec);
  }

  document.getElementById("modal-backdrop").classList.add("open");
}

function stat(label, value, note) {
  const row = el("div", { class: "stat-row" });
  row.append(el("span", { class: "stat-label" }, label));
  const v = el("span", { class: "stat-value" }, value);
  if (note) v.append(el("span", { class: "stat-note" }, " ", note));
  row.append(v);
  return row;
}

function closeModal() {
  document.getElementById("modal-backdrop").classList.remove("open");
}

document.getElementById("modal-backdrop").addEventListener("click", (e) => {
  if (e.target.id === "modal-backdrop") closeModal();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

document.getElementById("color-mode").addEventListener("change", (e) => {
  colorMode = e.target.value;
  renderLegend();
  renderMatrix();
});

renderLegend();
renderMatrix();
</script>
</body>
</html>
